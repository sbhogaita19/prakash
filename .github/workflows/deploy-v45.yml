name: Deploy Prakash seamless finish
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          echo '' | base64 -d > /tmp/p.tgz
          tar -xzf /tmp/p.tgz
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html sw.js
          git commit -m "Finish seamless timers and protocol signposts"
          git push

name: Deploy Prakash Om, all-food pause and mindfulness bell
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          echo '' | base64 -d > /tmp/p.tgz
          tar -xzf /tmp/p.tgz
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html sw.js manifest.webmanifest prakash-favicon.png prakash-icon-192.png prakash-icon-512.png
          git commit -m "Add Om identity, every-food pause and speaking bell"
          git push

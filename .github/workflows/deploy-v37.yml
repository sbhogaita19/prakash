name: Deploy Prakash v37
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Write v37
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/v37.tgz
          tar -xzf /tmp/v37.tgz
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html sw.js
          git commit -m "Build v37 day progress and meal preview"
          git push

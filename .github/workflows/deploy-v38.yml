name: Deploy Prakash v38
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Write v38
        run: |
          echo '' | base64 -d > /tmp/p.tgz
          tar -xzf /tmp/p.tgz
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html sw.js
          git commit -m "Refine Prakash v38 into one quiet app"
          git push

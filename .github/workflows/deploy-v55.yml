name: Deploy Prakash v55 talks and prayers, train swipe
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          echo '' | base64 -d > /tmp/p.tgz
          tar -xzf /tmp/p.tgz
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html sw.js manifest.webmanifest prakash-om-favicon.png prakash-om-192.png prakash-om-512.png
          git commit -m "v55: Talks and Prayers with lamps and lit circles, series thoughts, train swipe-to-complete"
          git push

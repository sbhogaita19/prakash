name: Apply radiant circle assets
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Write assets
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/iconpayload.tgz
          tar -xzf /tmp/iconpayload.tgz
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html manifest.webmanifest sw.js prakash-icon-192.png prakash-icon-512.png prakash-favicon.png
          git commit -m "Apply radiant circle app icon"
          git push

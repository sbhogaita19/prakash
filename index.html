<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#121615">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Prakash">
<title>Prakash</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="64x64" href="prakash-om-favicon.png">
<link rel="apple-touch-icon" sizes="192x192" href="prakash-om-192.png">
<style>
:root{
  --page:#121615;--card:#1c2220;--card2:#171c1a;--raise:#252d2a;--sel:#35403c;
  --ink:#f0f2ef;--ink2:#b3bdb8;--ink3:#8f9a95;--hair:#343c39;--hair2:#262e2b;
  --green:#67b695;--green-ink:#0c1813;--mint:#9fd6be;--link:#88d0b1;
  --now:#1a2a24;--now-line:#3f6a5a;--warn-bg:#2d2618;--warn-line:#7a6230;--warn-ink:#f0dfb5;
  --ring-eat:#e7b45a;--ring-eat-t:#3a3322;--ring-move:#7fd2ae;--ring-move-t:#223a31;--ring-still:#b4a4f5;--ring-still-t:#2c2a40;
  --danger:#ffaaa0;--danger-line:#7a3a36;--gold:#ffc861;
  --serif:'Iowan Old Style','Palatino Linotype',Georgia,serif;
  --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--page);color:var(--ink);font-family:var(--sans);font-size:17px;line-height:1.45;color-scheme:dark;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--link)}
.wrap{max-width:640px;margin:0 auto;padding:calc(14px + env(safe-area-inset-top)) 18px calc(110px + env(safe-area-inset-bottom))}
h1,h2,h3{font-weight:400;margin:0}
h1{font-family:var(--serif);font-size:32px;letter-spacing:-.01em}
h2{font-family:var(--serif);font-size:24px}
h3{font-size:18px;font-weight:600}
p{margin:0}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;align-items:center;gap:12px}
.between{display:flex;align-items:center;justify-content:space-between;gap:12px}
.muted{color:var(--ink2)}
.small{font-size:16px}
.tiny{font-size:16px;color:var(--ink2)}
.eyebrow{font-size:16px;letter-spacing:.04em;text-transform:uppercase;color:var(--mint);font-weight:600}
.card{background:var(--card);border:1px solid var(--hair);border-radius:18px;padding:16px}
.card.now{background:var(--now);border-color:var(--now-line)}
.card.flat{padding:4px 16px}
.hidden{display:none!important}
/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 16px;border-radius:14px;border:1px solid var(--hair);background:var(--raise);color:var(--ink);font-size:16px;cursor:pointer;text-decoration:none}
.btn.primary{background:var(--green);border-color:var(--green);color:var(--green-ink);font-weight:700}
.btn.big{min-height:54px;font-size:17px;width:100%}
.btn.ghost{background:transparent;border-color:transparent;color:var(--link);padding:0 8px}
.btn.danger{background:transparent;border-color:var(--danger-line);color:var(--danger)}
.btn:disabled{opacity:.45}
.btns{display:flex;gap:10px;flex-wrap:wrap}
.btns>.btn{flex:1 1 0}
.link{background:none;border:0;color:var(--link);min-height:44px;padding:0 4px;font-size:16px;cursor:pointer;font-weight:600}
.round{width:44px;height:44px;border-radius:22px;border:1px solid #56615c;background:transparent;color:var(--link);font-size:24px;line-height:1;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;flex:0 0 auto}
.step{width:44px;height:44px;border-radius:12px;border:1px solid var(--hair);background:var(--raise);font-size:22px;cursor:pointer;flex:0 0 auto}
.stepper{display:flex;align-items:center;gap:6px}
.stepper .val{min-width:74px;text-align:center}
/* fields */
label.lab,.lab{display:block;font-size:16px;color:var(--ink2);margin-bottom:6px}
.input{width:100%;min-height:50px;padding:0 12px;border-radius:12px;border:1px solid var(--hair);background:var(--card2);color:var(--ink);font-size:17px}
textarea.input{padding:10px 12px;min-height:90px;resize:vertical;line-height:1.45}
select.input{appearance:none;-webkit-appearance:none}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:44px;padding:0 16px;border-radius:22px;border:1px solid #56615c;background:var(--card);color:#e8ece9;font-size:16px;cursor:pointer}
.chip[aria-pressed=true]{background:#255d4b;border-color:#8cc5b3;color:#fff}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:4px;padding:4px;background:var(--card);border-radius:14px}
.seg button{min-height:44px;border:0;border-radius:10px;background:transparent;color:var(--ink2);font-size:16px;cursor:pointer;padding:0 2px;white-space:nowrap}
.seg button[aria-current=true],.seg button[aria-selected=true]{background:var(--sel);color:#fff;font-weight:600}
.check{display:flex;align-items:center;gap:12px;min-height:48px;cursor:pointer}
.check input{width:22px;height:22px;accent-color:var(--green)}
/* lists */
.list{list-style:none;margin:0;padding:0}
.li{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:62px;border-bottom:1px solid var(--hair2)}
.li:last-child{border-bottom:0}
.li .t{display:flex;flex-direction:column;min-width:0;flex:1}
.li .t strong{font-weight:500}
.li .t span{font-size:16px;color:var(--ink2)}
.li button.t{background:none;border:0;text-align:left;padding:8px 0;cursor:pointer;min-height:56px;justify-content:center}
.navrow{display:flex;align-items:center;justify-content:space-between;width:100%;min-height:60px;background:none;border:0;border-bottom:1px solid var(--hair2);padding:0;text-align:left;cursor:pointer;font-size:17px}
.navrow:after{content:'›';font-size:24px;color:var(--ink3)}
.navrow span{display:flex;flex-direction:column}
.navrow small{font-size:16px;color:var(--ink2)}
.facts{display:flex;flex-direction:column}
.fact{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--hair2)}
.fact:last-child{border-bottom:0}
.fact span{color:var(--ink2)}
.fact strong{text-align:right;font-weight:600}
details.fold>summary{min-height:52px;display:flex;align-items:center;justify-content:space-between;cursor:pointer;list-style:none;font-weight:600}
details.fold>summary::-webkit-details-marker{display:none}
details.fold>summary:after{content:'›';font-size:22px;color:var(--ink3);transition:transform .2s}
details.fold[open]>summary:after{transform:rotate(90deg)}
.warnbox{background:var(--warn-bg);border:1px solid var(--warn-line);border-radius:14px;padding:10px 12px}
.warnbox .tiny{color:var(--warn-ink)}
.hint{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--now);border:1px solid var(--now-line);border-radius:14px;padding:10px 12px 10px 14px;font-size:16px;line-height:1.4}
.hint .link{flex:none;padding:6px 4px}
html.big-text{zoom:1.18}
html.big-text .seg button{font-size:16px}
html.big-text .rings3-svg{width:min(38vw,150px)}
html.big-text .rings3-top{gap:14px}
html.big-text .rings3-keys .rs{white-space:nowrap}
.wchart .day{opacity:.35}
.dr-nums{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.dr-main{grid-template-columns:repeat(2,minmax(0,1fr))}
.dr-main .input{font-size:20px;font-weight:600}
.dr-more .dr-nums{margin-top:8px}
.showit{display:flex;align-items:center;gap:14px;text-align:left;cursor:pointer;padding:14px 16px;width:100%;font:inherit;color:var(--ink)}
.showit strong{font-size:18px}
@keyframes spanda{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.045);opacity:.9}}
.diya[aria-pressed=true] svg .fl{transform-box:fill-box;transform-origin:50% 100%;animation:spanda 4.8s ease-in-out infinite}
.diya[aria-pressed=true] svg .fl + .fl{animation-delay:.3s}
@media (prefers-reduced-motion:reduce){.diya svg .fl{animation:none!important}}
.dr-nums label{display:flex;flex-direction:column;gap:4px;min-width:0}
.dr-nums span{font-size:16px;color:var(--ink2);text-align:center}
.dr-nums .input{padding:10px 4px;text-align:center;font-size:17px;min-height:48px}
.food-thumb{width:44px;height:44px;border-radius:10px;object-fit:cover;flex:none;background:var(--card2)}
.rv-soft{font-size:17px!important;font-weight:500!important;color:var(--ink2)}
.rkey{background:none;border:0;padding:0;text-align:left;color:inherit;font:inherit;cursor:pointer;min-height:44px;display:block;width:100%}
.morning .diya svg{filter:drop-shadow(0 0 0 transparent)}
.searchbar input{min-height:44px}
.searchbar label{min-width:0}
.searchbar .iconbtn{width:48px}
.ac-wrap{position:relative}
.ac{position:absolute;left:0;right:0;top:calc(100% + 4px);z-index:5;background:var(--card);border:1px solid var(--hair);border-radius:14px;padding:0 14px;overflow-y:auto;overscroll-behavior:auto;box-shadow:0 12px 30px #0008}
.ac .ac-opt{cursor:pointer;min-height:56px}
.ac .ac-opt[aria-selected=true]{background:var(--raise);margin:0 -14px;padding:0 14px}
.ac .ac-note{padding:12px 0;list-style:none}
.link{min-width:44px}
.stop-open{background:none;border:0;color:var(--ink);font:inherit;cursor:pointer;padding:8px;min-height:44px;width:100%}
.set-hint{grid-column:1/-1;margin:-4px 0 6px;color:var(--warn-ink)}
.guess{display:block;font-size:16px;color:var(--warn-ink);margin-bottom:2px}
.ring-tap{cursor:pointer}
/* while the keyboard is up the tab bar steps aside, so the box being typed in has the room */
body.kb-open nav.tabs{display:none}
.talk-layer{position:fixed;inset:0;z-index:55;background:var(--page);display:flex;flex-direction:column}
.talk-full{display:flex;flex-direction:column;height:100%;width:min(100%,640px);margin:0 auto}
.talk-top{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:52px;padding:calc(6px + env(safe-area-inset-top)) 18px 6px}
.talk-top .link{min-height:44px}
.talk-scroll{flex:1;overflow:auto;padding:4px 18px calc(24px + env(safe-area-inset-bottom));-webkit-overflow-scrolling:touch}
.talk-mini{display:none}
.talk-layer.mini{inset:auto 0 var(--tabs-h,0px) 0;height:auto;background:transparent;pointer-events:none}
.talk-layer.mini .talk-full{position:fixed;left:0;top:0;width:2px;height:2px;overflow:hidden;opacity:0;pointer-events:none}
.talk-layer.mini .talk-mini{display:flex;align-items:center;gap:10px;pointer-events:auto;width:min(calc(100% - 16px),624px);margin:0 auto 8px;padding:6px 8px 6px 14px;background:var(--now);border:1px solid var(--now-line);border-radius:16px;box-shadow:0 8px 30px #0008}
.talk-mini-t{flex:1;min-width:0;min-height:48px;background:none;border:0;color:var(--ink);text-align:left;font:inherit;cursor:pointer;display:flex;flex-direction:column;justify-content:center}
.talk-mini-t strong{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
body.has-dock .wrap{padding-bottom:calc(180px + env(safe-area-inset-bottom))}
body.kb-open .talk-layer.mini{display:none}
.tplayer input[type=range]{width:100%;min-height:44px;accent-color:#7fd2ae}
.talk-mini .btn{min-height:44px;padding:0 14px}
.okbox{background:var(--now);border:1px solid var(--now-line);border-radius:14px;padding:12px 14px}
/* top */
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.brand{display:flex;align-items:center;gap:10px}
.brand img{width:34px;height:34px;border-radius:9px}
.backbar{display:flex;align-items:center;gap:6px;min-height:44px;margin-bottom:4px}
/* nav */
nav.tabs{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(100%,640px);z-index:20;background:rgba(20,25,23,.97);border-top:1px solid var(--hair);display:grid;grid-template-columns:repeat(5,minmax(0,1fr));padding-bottom:env(safe-area-inset-bottom)}
nav.tabs button{border:0;background:none;color:var(--ink2);min-height:64px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:16px;cursor:pointer}
nav.tabs button[aria-current=true]{color:#7fd2ae;font-weight:600}
nav.tabs svg{width:24px;height:24px}
/* lamp */
.diya{background:none;border:0;padding:6px;cursor:pointer;min-width:52px;min-height:52px;display:inline-flex;align-items:center;justify-content:center}
.diya .fl{opacity:.16;transition:opacity .5s}
.diya .bw{opacity:.45;transition:opacity .5s}
.diya[aria-pressed=true] .fl{opacity:1;filter:drop-shadow(0 0 6px rgba(255,190,90,.7))}
.diya[aria-pressed=true] .bw{opacity:.95}
.diya[aria-pressed=true] svg{animation:flick 4.5s ease-in-out infinite;transform-origin:50% 82%}
@keyframes flick{0%,100%{transform:scaleY(1)}50%{transform:scaleY(1.045)}}
@media (prefers-reduced-motion:reduce){.diya[aria-pressed=true] svg{animation:none}}
.lampbtn{width:52px;height:52px;border-radius:26px;border:2px solid #6f7d78;background:transparent;display:inline-flex;align-items:center;justify-content:center;padding:0;cursor:pointer;flex:0 0 auto}
.lampbtn[aria-pressed=true]{border:1px solid #9fe6c4;background:#2d2a1c}
.lampbtn .fl{opacity:.16}.lampbtn .bw{opacity:.45}
.lampbtn[aria-pressed=true] .fl{opacity:1}.lampbtn[aria-pressed=true] .bw{opacity:1}
/* three rings */
.rings3{background:var(--card);border:1px solid var(--hair);border-radius:20px;padding:18px 16px;display:flex;flex-direction:column;gap:16px}
.rings3-top{display:flex;align-items:center;gap:18px}
.rings3-svg{width:min(52vw,200px);height:auto;flex:0 0 auto}
.rings3-keys{display:flex;flex-direction:column;gap:10px;min-width:0}
.rings3-keys .rk{font-size:16px;letter-spacing:.06em;text-transform:uppercase;font-weight:700}
.rings3-keys .rv{font-size:24px;font-weight:700;line-height:1.1}
.rings3-keys .rs{font-size:16px;color:var(--ink2)}
.rings3-keys .rstep{display:block;min-height:36px;padding:0;font-size:16px;text-align:left;white-space:nowrap}
.rings3-facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;border-top:1px solid var(--hair2);padding-top:14px}
.rings3-facts button{min-height:62px;border-radius:14px;border:1px solid var(--hair);background:var(--raise);display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;padding:4px}
.rings3-facts strong{font-size:16px}.rings3-facts span{font-size:16px;color:var(--ink2);text-align:center}
/* food */
.meal{background:var(--card);border:1px solid var(--hair);border-radius:18px;padding:6px 16px 8px}
.meal-head{display:flex;justify-content:space-between;align-items:center;min-height:52px}
.meal-head strong{font-size:18px}
.food-row{display:flex;align-items:center;gap:10px;min-height:56px;border-top:1px solid var(--hair2);width:100%;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;padding:6px 0;cursor:pointer}
.food-row .t{flex:1;display:flex;flex-direction:column;min-width:0}
.food-row .t span{font-size:16px;color:var(--ink2)}
.food-row .k{font-size:16px;color:var(--ink2);white-space:nowrap}
.week-strip{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px;background:var(--card);border-radius:16px;padding:6px}
.day-pill{border:0;background:transparent;border-radius:12px;min-height:58px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;color:var(--ink2);font-size:16px}
.day-pill b{font-size:16px;color:var(--ink);font-weight:500;width:30px;height:30px;display:grid;place-items:center;border-radius:15px}
.day-pill i{width:5px;height:5px;border-radius:3px;background:transparent}
.day-pill i.dot{background:var(--mint)}
.day-pill[aria-current=true] b{background:var(--green);color:var(--green-ink);font-weight:700}
.day-pill:disabled,.link:disabled{opacity:.35;cursor:default}
.day-head{font-size:20px;margin:6px 0 0}
.for-day{margin:0;font-size:17px}
.later{display:inline-block;align-self:flex-start;width:max-content;max-width:100%;font-size:16px;color:var(--ink2);border:1px solid var(--hair);border-radius:10px;padding:1px 8px;margin-top:4px}
.bar-svg text{fill:var(--ink2);font-size:11px}
/* sheet */
.sheet-back{position:fixed;inset:0;bottom:var(--kb,0px);z-index:60;background:#000a;display:flex;align-items:flex-end;justify-content:center}
.sheet{width:min(100%,640px);max-height:92vh;max-height:calc(var(--vvh,100vh) * .92);overflow:auto;background:var(--page);border-radius:24px 24px 0 0;padding:14px 18px calc(24px + env(safe-area-inset-bottom));box-shadow:0 -20px 60px #0006;-webkit-overflow-scrolling:touch}
.sheet.full{height:100%;max-height:100%;border-radius:0;padding-top:calc(10px + env(safe-area-inset-top))}
.sheet-top{display:flex;align-items:center;justify-content:space-between;min-height:48px;margin-bottom:6px;position:sticky;top:-14px;background:var(--page);z-index:2}
.sheet-top h2{font-family:var(--sans);font-size:18px;font-weight:600}
.searchbar{display:flex;gap:8px}
.searchbar label{flex:1;display:flex;align-items:center;gap:8px;min-height:50px;padding:0 12px;border-radius:14px;background:var(--card);border:1px solid var(--hair)}
.searchbar input{flex:1;min-width:0;background:transparent;border:0;outline:none;font-size:17px}
.iconbtn{width:50px;min-height:50px;border-radius:14px;background:var(--card);border:1px solid var(--hair);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;flex:0 0 auto}
.big-num{font-size:34px;font-weight:700;line-height:1.1}
/* overlays */
.toast{position:fixed;left:16px;right:16px;bottom:calc(84px + env(safe-area-inset-bottom));z-index:90;background:#eef2ef;color:#16201c;padding:12px 16px;border-radius:14px;font-size:16px;text-align:center;box-shadow:0 8px 30px #0008}
.undo{position:fixed;left:16px;right:16px;bottom:calc(84px + env(safe-area-inset-bottom));z-index:91;background:#25322d;padding:8px 8px 8px 16px;border:1px solid #567468;border-radius:14px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.focus-mode{position:fixed;inset:0;z-index:80;background:#0d100f;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:36px;text-align:center}
.focus-mode .big{font-family:var(--serif);font-size:56px}
.focus-mode .line{font-family:var(--serif);font-size:20px;color:#b9c2be;max-width:340px;line-height:1.6}
.stop-leave{margin-top:18px;background:none;border:none;color:#8a958f;font-size:16px;min-height:48px;padding:8px 18px;cursor:pointer}
/* train */
.player{position:static;background:var(--page)}
.wo-bar{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:52px;padding:6px 8px 6px 16px;border-radius:16px;background:var(--now);border:1px solid var(--now-line)}
.player-in{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
.player .setrow{min-height:47px}
.player .sets{gap:4px}
.player .set-last{margin:-5px 0 0 44px;color:var(--ink3,#8a958f);line-height:1.15}
.player .setrow input{min-height:46px}
.player .tick{width:46px;height:46px}
.player .warm{padding:12px 16px}
.player .warm-btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.player .warm-btns.has-back{grid-template-columns:52px 1fr 1fr}
.player .warm-btns.has-back:has(> :nth-child(2):last-child){grid-template-columns:52px 1fr}
.player .warm-btns .btn:only-child{grid-column:1/-1}
.player .wo-actions{display:flex;flex-direction:column;gap:10px}
.player .feelrow{display:grid;grid-template-columns:auto 1fr 1fr 1fr;gap:8px;align-items:center}
.player .feelrow .chip{padding-left:6px;padding-right:6px}
.progress{height:6px;border-radius:3px;background:#2a322f;overflow:hidden}.progress i{display:block;height:6px;background:#7fd2ae}
.sets{display:flex;flex-direction:column;gap:6px}
.setrow{display:grid;grid-template-columns:36px minmax(0,1fr) minmax(0,1fr) 56px;gap:8px;align-items:center;min-height:60px;border-radius:12px;padding-left:8px;touch-action:pan-y}
.setrow.done{background:rgba(115,168,154,.14)}
.setrow input{min-height:48px;border-radius:10px;border:1px solid var(--hair);background:var(--card2);font-size:18px;text-align:center;min-width:0;width:100%}
.tick{width:48px;height:48px;border-radius:24px;border:2px solid #6f7d78;background:transparent;justify-self:center;display:flex;align-items:center;justify-content:center;cursor:pointer}
.tick[aria-pressed=true]{border:0;background:#7fd2ae;color:var(--green-ink)}
.restbar{display:flex;align-items:center;justify-content:space-between;min-height:56px;padding:0 8px 0 16px;border-radius:16px;background:var(--now);border:1px solid var(--now-line)}
/* practice */
.talk{display:flex;align-items:center;gap:8px;min-height:60px;border-top:1px solid var(--hair2);touch-action:pan-y;transition:background .2s}
.talk .name{flex:1;min-width:0;font-size:16px;color:var(--ink);text-decoration:none;min-height:48px;display:flex;align-items:center}
.talk button.talk-open{text-align:left;background:none;border:0;padding:8px 0;font:inherit;text-align:left;flex-direction:column;align-items:flex-start;justify-content:center;gap:2px;cursor:pointer}
.talk button.talk-open small{font-size:16px;color:var(--ink3);line-height:1.35}
.osho-cat{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;margin-top:3px;font-size:14px;color:var(--ink3)}
.osho-th{font-size:13px;padding:1px 8px;border:1px solid var(--hair2);border-radius:10px;color:var(--ink2)}
.osho-facts{margin:10px 0 0;display:flex;flex-direction:column;gap:4px}.osho-facts div{display:flex;gap:10px}.osho-facts dt{flex:none;width:92px;color:var(--ink3)}.osho-facts dd{margin:0;min-width:0;overflow-wrap:anywhere}
:lang(hi){font-family:'Kohinoor Devanagari','Devanagari Sangam MN','Noto Sans Devanagari','Nirmala UI','Mangal',var(--sans)}
.osho-phase{margin:14px 0 2px;font-size:14px;letter-spacing:.04em;text-transform:uppercase;color:var(--ink3);font-weight:600}
button.card.continue{width:100%;font:inherit;color:var(--ink);text-align:left;display:flex;justify-content:space-between;align-items:center;gap:12px;cursor:pointer}
.reader-frame{width:100%;height:62vh;border:0;border-radius:14px;background:var(--card2)}
.themes{margin:0 0 12px 56px;padding:12px 14px;border-radius:14px;background:var(--card2);border:1px solid var(--hair)}
.themes ul{margin:6px 0 0;padding-left:18px}
.prayer-text{font-family:var(--serif);font-size:19px;line-height:1.6;white-space:pre-line;color:#e6ebe8}
.journal-q{font-family:var(--serif);font-size:20px;line-height:1.5}
.quote{font-family:var(--serif);font-size:19px;line-height:1.5;color:#dfe5e2}
.quote span{display:block;font-family:var(--sans);font-size:16px;color:var(--ink2);margin-top:6px}
.timer{font-family:var(--serif);font-size:56px;text-align:center}
table.t{width:100%;border-collapse:collapse;font-size:16px}
table.t th,table.t td{padding:8px 6px;border-bottom:1px solid var(--hair2);text-align:left}
.photogrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.photogrid img{width:100%;border-radius:12px;display:block}
.datefield{position:relative;display:block}.datefield input{color:transparent}.datefield input::-webkit-datetime-edit{color:transparent;opacity:0}.datefield .date-show{position:absolute;left:13px;top:50%;transform:translateY(-50%);pointer-events:none;font-size:17px;color:var(--ink)}

/* setup */

#setup.open{display:block}
#setup .in{max-width:560px;margin:0 auto;padding:calc(24px + env(safe-area-inset-top)) 20px 40px;display:flex;flex-direction:column;gap:16px}
.dots{display:flex;gap:6px}.dots i{height:4px;flex:1;border-radius:4px;background:#3a4440}.dots i.on{background:var(--green)}
.choice{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;min-height:64px;padding:12px 14px;border:1px solid var(--hair);border-radius:14px;background:var(--card);text-align:left;cursor:pointer}
.choice[aria-pressed=true]{border-color:#73a89a;background:#1f3a31}

:focus-visible{outline:2px solid #9fe6c4;outline-offset:2px}

</nav>
<script>
'use strict';
/* ================= Prakash ================= */
const VERSION = '1.10.1';
const KEY = 'sadhana-v1';            // kept so existing data carries over
const DRAFT_KEY = 'prakash-workout-draft-v1';
const JOURNAL_DRAFT_KEY = 'prakash-journal-draft-v1';
const GEMINI_MODELS = ['gemini-3.8-flash', 'gemini-3.7-flash', 'gemini-3.6-flash', 'gemini-3.5-flash', 'gemini-3.5-flash-lite', 'gemini-3.1-flash-lite', 'gemini-3-flash-preview']; // tried in order; first that answers wins
const MEALS = [['breakfast', 'Breakfast'], ['lunch', 'Lunch'], ['dinner', 'Dinner'], ['snack', 'Snacks']];
const MEAL_NAME = Object.fromEntries(MEALS);
const REASONS = ['Hungry', 'Habit', 'Feeling', 'Bored', 'Company'];
const FIBRE_GOAL = 30;

/* ---------- small utils ---------- */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }
function keyOf(d) { d = d || new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
const todayKey = () => keyOf();
function dateOf(k) { const a = k.split('-').map(Number); return new Date(a[0], a[1] - 1, a[2]); }
function addDays(k, n) { const d = dateOf(k); d.setDate(d.getDate() + n); return keyOf(d); }
const MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'], WDAY = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
function validDate(d) { return d != null && d !== '' && !isNaN(new Date(d).getTime()); }
function fmtD(d) { if (!validDate(d)) return ''; d = new Date(d); return d.getDate() + ' ' + MON[d.getMonth()] + ' ' + d.getFullYear(); }   // 24 Sep 2026, everywhere
function fmtDate(k) { return fmtD(dateOf(k)); }
function fmtDay(k) { const d = dateOf(k); return WDAY[d.getDay()] + ' ' + fmtD(d); }
/* A date field that always reads "24 Sep 2026": the phone's own date picker sits invisibly on top. */
function dateField(id, value, attrs) { return `<span class="datefield"><input class="input" type="date" id="${id}" value="${esc(value || '')}" ${attrs || ''}><span class="date-show" aria-hidden="true">${value ? fmtDate(value) : 'Choose a date'}</span></span>`; }
document.addEventListener('input', e => { const i = e.target; if (i && i.type === 'date' && i.parentNode && i.parentNode.classList && i.parentNode.classList.contains('datefield')) { const s = i.parentNode.querySelector('.date-show'); if (s) s.textContent = i.value ? fmtDate(i.value) : 'Choose a date'; } }, true);
document.addEventListener('change', e => { const i = e.target; if (i && i.type === 'date' && i.parentNode && i.parentNode.classList && i.parentNode.classList.contains('datefield')) { const s = i.parentNode.querySelector('.date-show'); if (s) s.textContent = i.value ? fmtDate(i.value) : 'Choose a date'; } }, true);
function fmtTime(d) { return new Date(d).toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' }); }
function n0(x) { return Math.round(Number(x) || 0); }
function n1(x) { return Math.round((Number(x) || 0) * 10) / 10; }
function num(v) { const x = parseFloat(String(v == null ? '' : v).replace(',', '.')); return isFinite(x) ? x : null; }
function big(x) { return n0(x).toLocaleString('en-GB'); }
function mins(t) { const p = String(t || '0:0').split(':'); return (+p[0] || 0) * 60 + (+p[1] || 0); }
function nowMins() { const d = new Date(); return d.getHours() * 60 + d.getMinutes(); }
function mondayOf(k) { const d = dateOf(k); d.setDate(d.getDate() - ((d.getDay() + 6) % 7)); return keyOf(d); }
function weekKeys(k) { const m = mondayOf(k); return [0, 1, 2, 3, 4, 5, 6].map(i => addDays(m, i)); }
function lastDays(n) { const t = todayKey(); const out = []; for (let i = n - 1; i >= 0; i--) out.push(addDays(t, -i)); return out; }
const CM_IN = 2.54;
function waistShow(cm) { if (cm == null) return '-'; return S.profile.waistUnit === 'cm' ? n1(cm) + ' cm' : n1(cm / CM_IN) + ' in'; }
/* weight: kg, or stones and pounds */
const KG_LB = 2.20462;
function stLb(kg) { let lb = Math.round(kg * KG_LB); const st = Math.floor(lb / 14); lb = lb - st * 14; return [st, lb]; }
function wShow(kg) { if (kg == null || !(+kg > 0)) return '-'; if (S.profile.weightUnit === 'st') { const [st, lb] = stLb(+kg); return st + ' st ' + lb + ' lb'; } return n1(kg) + ' kg'; }
function wChartVal(kg) { return S.profile.weightUnit === 'st' ? n1(kg * KG_LB / 14) : n1(kg); }
function wChartUnit() { return S.profile.weightUnit === 'st' ? 'st' : 'kg'; }
function weightFields(prefix, kg, label, extra) {
  if (S.profile.weightUnit === 'st') { const v = kg ? stLb(+kg) : ['', '']; return `<fieldset class="wfield" style="border:0;padding:0;margin:0"><legend class="lab">${esc(label)}</legend><div class="grid2"><div><label class="lab" for="${prefix}-st">Stones</label><input class="input" id="${prefix}-st" inputmode="numeric" value="${v[0]}" ${extra || ''}></div><div><label class="lab" for="${prefix}-lb">Pounds</label><input class="input" id="${prefix}-lb" inputmode="decimal" value="${v[1]}" ${extra || ''}></div></div></fieldset>`; }
  return `<div><label class="lab" for="${prefix}">${esc(label)} (kg)</label><input class="input" id="${prefix}" inputmode="decimal" value="${kg ? n1(kg) : ''}" ${extra || ''}></div>`;
}
function unitChips(act) {
  const p = S.profile, row = (k, label, opts, cur) => `<div><span class="lab">${label}</span><div class="chips">${opts.map(o => `<button class="chip" data-a="${act}" data-k="${k}" data-u="${o[0]}" aria-pressed="${cur === o[0]}">${o[1]}</button>`).join('')}</div></div>`;
  return row('weightUnit', 'Weigh yourself in', [['kg', 'Kilograms'], ['st', 'Stones and pounds']], p.weightUnit === 'st' ? 'st' : 'kg') + row('waistUnit', 'Measure your waist in', [['in', 'Inches'], ['cm', 'Centimetres']], p.waistUnit === 'cm' ? 'cm' : 'in');
}
function readWeight(prefix) {
  if (S.profile.weightUnit === 'st') { const st = num(($('#' + prefix + '-st') || {}).value), lb = num(($('#' + prefix + '-lb') || {}).value); if (st == null && lb == null) return null; return n1(((st || 0) * 14 + (lb || 0)) / KG_LB); }
  return num(($('#' + prefix) || {}).value);
}
function waistToCm(v) { v = num(v); if (v == null) return null; return S.profile.waistUnit === 'cm' ? v : n1(v * CM_IN); }

/* ---------- state ---------- */
function defaults() {
  return {
    v: 1, schema: 2,
    profile: {
      setupDone: false, onboardedV: 0, sex: '', dob: null, heightCm: null,
      kcalTarget: null, proteinTarget: null, waterTarget: 8, stepsTarget: null, moveTarget: null, stillTarget: null, v17: 1,
      goalWeight: null, waistGoalCm: null, waistUnit: 'in', weightUnit: 'kg',
      wake: '06:00', foodFrom: '06:30', foodTo: '18:30', bed: '22:00',
      trainingDays: 3, bpSafe: true, vegetarian: true, eggFree: true,
      breathBeforeMeals: true, silentWeekday: -1, restSec: 120,
      modules: { food: true, train: true, body: true, mind: true, spiritual: true }
    },
    days: {}, weights: [], waists: [], photos: [], workouts: [], meditations: [],
    bloodPressures: [], events: [], foodFavourites: [], dishes: [], foundFoods: [], myStaples: [],
    witness: { entries: [], readings: [] },
    talks: { heard: {}, themes: {}, notes: {} },
    remember: { on: true, from: '08:00', to: '22:00', schedule: null, waitNote: '' },
    walkTimer: { startedAt: null }, meditationTimer: { startedAt: null }, sleepTimer: { startedAt: null },
    todayOnly: null, photoReminder: { on: false }
  };
}
function migrate(s) {
  const d = defaults();
  const hadData = !!(s && s.profile);
  if (!hadData) return d;
  const old = s.schema !== 2, was17 = !!(s.profile && s.profile.v17);
  s.profile = Object.assign({}, d.profile, s.profile || {});
  s.profile.modules = Object.assign({}, d.profile.modules, s.profile.modules || {});
  for (const k of Object.keys(d)) if (s[k] === undefined) s[k] = d[k];
  ['weights', 'waists', 'photos', 'workouts', 'meditations', 'bloodPressures', 'events', 'foodFavourites', 'dishes', 'foundFoods', 'myStaples'].forEach(k => { if (!Array.isArray(s[k])) s[k] = []; });
  // foods found online by the old packet search (and its barcodes) move into your found foods, so they keep working offline
  if (!s.foundMoved) { try { const oc = JSON.parse(localStorage.getItem('prakash-off-cache-en') || '{}') || {}, seen = new Set(s.foundFoods.map(x => (x.name + '|' + (x.brand || '')).toLowerCase())); Object.keys(oc).sort((a, b) => oc[b].at - oc[a].at).forEach(q => ((oc[q] || {}).c || []).forEach(c => { if (!c || !c.name || !(+c.k > 0)) return; const key = (c.name + '|' + (c.brand || '')).toLowerCase(); if (seen.has(key)) return; seen.add(key); const x = Object.assign({}, c, { at: oc[q].at || 0 }); if (q.charAt(0) === '#') x.code = q.slice(1); s.foundFoods.push(x); })); s.foundFoods = s.foundFoods.slice(0, 300); } catch (e) {} s.foundMoved = 1; }
  if (!s.witness) s.witness = { entries: [], readings: [] };
  if (!Array.isArray(s.witness.entries)) s.witness.entries = [];
  if (!Array.isArray(s.witness.readings)) s.witness.readings = [];
  // entries with no usable date and no words are empty shells: drop them. Entries with words stay, dated or not.
  s.witness.entries = s.witness.entries.filter(e => e && (validDate(e.created) || ['direct', 'story', 'nextStep', 'wonder'].some(k => String(e[k] || '').trim())));
  if (!s.talks) s.talks = { heard: {}, themes: {}, notes: {} };
  ['heard', 'themes', 'notes'].forEach(k => { if (!s.talks[k]) s.talks[k] = {}; });
  // talks that moved address: what was heard, noted or renamed follows the talk
  if (typeof TALK_MOVES !== 'undefined') ['heard', 'themes', 'notes', 'titles', 'pos'].forEach(k => { const o = s.talks[k]; if (!o) return; Object.keys(TALK_MOVES).forEach(from => { if (o[from] !== undefined) { if (o[TALK_MOVES[from]] === undefined) o[TALK_MOVES[from]] = o[from]; delete o[from]; } }); });
  // 1.7: a calorie target nobody chose (the old 1,700 default left by "Skip for now") becomes "not set yet"
  if (!was17) { const p = s.profile; if (+p.kcalTarget === 1700 && !p.dob && !p.heightCm && !p.kcalSet) p.kcalTarget = null; p.v17 = 1; }
  // Gemini auth keys start with 'AQ.'; earlier versions saved them without the dot, so ask for the key again
  if (s.profile && typeof s.profile.geminiKey === 'string' && /^AQ/.test(s.profile.geminiKey) && !/^AQ\./.test(s.profile.geminiKey)) { delete s.profile.geminiKey; delete s.profile.geminiModel; }
  if (old) {
    // v72 and earlier: bring across what still has meaning
    const a = s.awareness || {};
    Object.assign(s.talks.notes, a.notes || {});
    if (a.seriesDone) for (const ch of TALKS) for (const g of ch[2]) if (a.seriesDone[g[0]]) g[1].forEach(t => { s.talks.heard[t[1]] = a.seriesDone[g[0]]; });
    delete s.awareness; delete s.speakingNotices; delete s.restNudgeDismissed;
    if (s.profile.setupDone) s.needsWelcome = true;   // v72 skipped onboarding for existing data
    if (!s.profile.startedOn) { const ks = Object.keys(s.days || {}).sort(); s.profile.startedOn = ks[0] || null; }
    delete s.profile.mig171; delete s.profile.migWcm; delete s.profile.onboardingVersion;
    s.schema = 2;
  }
  return s;
}
function load() { try { const raw = localStorage.getItem(KEY); if (raw) return migrate(JSON.parse(raw)); } catch (e) {} return defaults(); }
let S;
let saveT = null;
function saveNow() { clearTimeout(saveT); saveT = null; staplesMemo = null; try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { toast('The phone is out of space for Prakash. Download a backup, then delete old photos.'); } }
function save() { clearTimeout(saveT); saveT = setTimeout(saveNow, 250); }
window.addEventListener('pagehide', saveNow);
document.addEventListener('visibilitychange', () => { if (document.hidden && saveT) saveNow(); });

function emptyDay() { return { water: 0, steps: 0, walkMin: 0, foods: [], sleep: null, bedTime: '', wokeTime: '', morningChai: false, closed: false, silent: false, gratitude: ['', '', ''] }; }
function day(k) { if (!S.days[k]) S.days[k] = emptyDay(); const d = S.days[k]; if (!Array.isArray(d.foods)) d.foods = []; if (!Array.isArray(d.gratitude)) d.gratitude = ['', '', '']; return d; }
function peekDay(k) { return S.days[k] || null; }
function T() { const t = todayKey(); if (!S.todayOnly || S.todayOnly.date !== t) S.todayOnly = { date: t, lamp: false, prayers: {}, bell: [] }; return S.todayOnly; }
function mods() { return S.profile.modules; }
function quietToday() { return !!(S.todayOnly && S.todayOnly.date === todayKey() && S.todayOnly.quiet); }
function quiet() { return !!S.profile.quiet || quietToday() || (!!S.profile.quietDefault && nowMins() < 18 * 60); }
/* a target shows only when it's set and the day isn't quiet */
const tgt = k => { const v = +S.profile[k]; return v > 0 ? v : null; };
const showK = () => !quiet() && !!tgt('kcalTarget'), showP = () => !quiet() && !!tgt('proteinTarget'), showS = () => !quiet() && !!tgt('stepsTarget'),
  showM = () => !quiet() && !!tgt('moveTarget'), showSt = () => !quiet() && !!tgt('stillTarget');
/* one-time hints: shown once, where they're needed, gone for good when used or dismissed */
function hintSeen(id) { return !!(S.profile.hints || {})[id]; }
function hintDone(id) { S.profile.hints = S.profile.hints || {}; if (!S.profile.hints[id]) { S.profile.hints[id] = 1; save(); } }
function hint(id, text) { if (hintSeen(id)) return ''; return `<div class="hint" role="note"><span>${esc(text)}</span><button class="link" data-a="hint-ok" data-h="${id}">Got it</button></div>`; }
/* larger text */
function applyTextSize() { document.documentElement.classList.toggle('big-text', !!(S && S.profile && S.profile.bigText)); }
/* keep the screen on while sitting or training */
let wakeSentinel = null;
async function syncWake() {
  const want = !!((S.meditationTimer && S.meditationTimer.startedAt) || (typeof draft !== 'undefined' && draft)) && !document.hidden;
  try {
    if (want && !wakeSentinel && navigator.wakeLock) { wakeSentinel = await navigator.wakeLock.request('screen'); wakeSentinel.addEventListener('release', () => { wakeSentinel = null; }); }
    else if (!want && wakeSentinel) { const w = wakeSentinel; wakeSentinel = null; await w.release(); }
  } catch (e) { wakeSentinel = null; }
}
document.addEventListener('visibilitychange', () => { if (!document.hidden) syncWake(); });
function totals(d) { let k = 0, p = 0, f = 0, c = 0, b = 0; for (const x of (d && d.foods) || []) { k += +x.kcal || 0; p += +x.protein || 0; f += +x.fat || 0; c += +x.carbs || 0; b += +x.fibre || 0; } return { kcal: n0(k), protein: n1(p), fat: n1(f), carbs: n1(c), fibre: n1(b) }; }
function realFoods(d) { return ((d && d.foods) || []).filter(f => !f.autoChai); }
function mealFoods(d, sl) { return d.foods.filter(f => (f.slot || 'snack') === sl); }
function isSilent(k) { const d = peekDay(k); if (d && d.silent) return true; return S.profile.silentWeekday >= 0 && dateOf(k).getDay() === S.profile.silentWeekday && !(d && realFoods(d).length) && !(d && d.silentOff); }
function macroGoals() { const p = S.profile; if (!tgt('kcalTarget')) return { fatG: 0, carbG: 0 }; const fatG = Math.round(p.kcalTarget * 0.3 / 9); const carbG = Math.max(0, Math.round((p.kcalTarget - p.proteinTarget * 4 - fatG * 9) / 4)); return { fatG, carbG }; }

/* swipe helper: horizontal swipe on an element; vertical scroll untouched */
function swipe(el, right, left) {
  let sx = 0, sy = 0, live = false;
  el.addEventListener('touchstart', e => { const t = e.changedTouches[0]; sx = t.clientX; sy = t.clientY; live = true; }, { passive: true });
  el.addEventListener('touchend', e => { if (!live) return; live = false; const t = e.changedTouches[0], dx = t.clientX - sx, dy = t.clientY - sy; if (Math.abs(dx) < 70 || Math.abs(dy) > Math.abs(dx) * 0.6) return; el.dataset.swiped = '1'; setTimeout(() => delete el.dataset.swiped, 400); if (dx > 0) right && right(); else left && left(); }, { passive: true });
}

/* Steps: one number, typed as it reads on the phone or watch ("8,000", "8 000", "8k" and "8.5k" all work).
   Today or yesterday; the number already there is selected, so typing replaces it; the keyboard's Done saves. */
function parseSteps(v) {
  let s = String(v == null ? '' : v).trim().toLowerCase().replace(/steps?$/, '').trim(); if (!s) return NaN;
  const k = /k$/.test(s); if (k) s = s.slice(0, -1).trim();
  if (k) { s = s.replace(',', '.').replace(/\s/g, ''); return /^\d+(\.\d+)?$/.test(s) ? Math.round(parseFloat(s) * 1000) : NaN; }
  s = s.replace(/[\s,’']/g, '').replace(/\.(?=\d{3}(\D|$))/g, '');   // thousands separators: 8,000 · 8 000 · 8.000
  return /^\d+$/.test(s) ? parseInt(s, 10) : NaN;
}

function aboutHtml() {

  <section class="card stack" style="gap:8px"><h2>Why a mirror</h2><p class="small">In Kashmir Shaivism, <i>prakāśa</i> is light: the plain awareness in which everything shows itself. <i>Vimarśa</i> is that light knowing itself, the way a mirror shows a face without adding to it.</p><p class="small">Prakash tries to do only the second part. It shows your day back to you, numbers included: what you ate, how you moved, when you sat. The numbers are there to be seen, not to grade you. The seeing is yours.</p><p class="small">What looks through all of this, the seeing itself, Kashmir Shaivism calls Shiva. Prakash doesn’t show that. It only leaves room for it.</p></section>
  <section class="card stack"><h2>What’s new</h2><ul class="small" style="padding-left:20px;margin:0;display:flex;flex-direction:column;gap:6px"><li>1.10.1: Add to a past day is easier to find: at the top of Train, and as “Earlier day…” beside Today and Yesterday when you enter steps.</li><li>1.10.0: add to a past day. Train › Add to a past day sets the day’s steps and walking minutes, or logs a workout from memory; Practice › Sit › Log a past sit does the same for a sit. Each is marked “Added later” with the date you entered it. Today’s rings, the next workout, timers and lamps are not changed.</li><li>1.9.14: each Osho talk shows when it was spoken (year and phase), its language and its theme. Open a talk for the full date, place and date source. In Listen, Osho by theme groups the same talks by theme; your series, lamps and progress are unchanged.</li><li>Finding a food: type two letters and suggestions appear under the box, from your dishes, what you’ve had, and the staples on this phone. A tap puts it in the draft to check first. Search online is optional, with your own free USDA key in Settings › Food lookup, where the staples table can also be seen and changed.</li><li>1.9.12: Energy in and out never guesses your weight. Until your weight, height and date of birth are in, it shows only the movement you logged and says what’s missing; the total and the difference appear, marked as an estimate, once they are.</li><li>1.9.12: in a workout, each set shows what you did last time, small and beside it (“last: 40 × 8”), and each exercise shows how it felt the last three times. Today’s boxes start empty; nothing is filled in for you.</li><li>1.9.12: Say it has its own button at the top of Food: speak or type what you had, then check it before anything is added.</li><li>1.9.12: Ask the mirror, in You: one question about your own logs, answered with facts and numbers only. Nothing is kept.</li><li>1.9.12: every talk has two plain lines: what it is, and which discourse and how long.</li><li>1.9.12: small fixes in the Sunday look-back: “1 day” instead of “1 days”, no more “0 of 0”, the heading stays on one line, and the day lists no longer repeat the averages shown above them.</li><li>1.9.11: the energy a workout uses now follows how long it took and how hard it felt. Your “Felt” answer for each exercise (Easy, About right or Hard) sets the effort; exercises not rated count as About right, and the kettlebell day counts a little higher.</li><li>1.9.10: Energy in and out shows every part of “out” on the card itself: resting, steps, training and meditation. With no steps entered yet, it says so, with an Add steps button.</li><li>1.9.9: a card on Today, Energy in and out: in is what your food diary holds; out is an estimate from your details plus steps or walks, workouts and the moving stages of Kundalini. The food diary still only records what you eat. The Sunday look-back shows the week’s average of both.</li><li>1.9.9: the Sunday look-back opens with the week in one view: food, training and walking, steps, meditation, the talks you heard, sleep and water, side by side, with your targets beside them as plain numbers.</li><li>1.9.9: a section on death, apart from the path: Osho’s The Art of Dying (English) and Main Mrityu Sikhata Hun (Hindi), ten talks each.</li><li>1.9.9: Osho’s talks now play inside Prakash itself: Play, Pause, back 15 s, forward 30 s. They keep going while you use the rest of the app and with the screen off, with controls on the lock screen, and each talk carries on from where you stopped. “Keep listening” folds a talk into a small bar above the tabs.</li><li>1.9.9: Listen is now one path, with Osho and Alan Watts only: 1 Awareness, 2 Witness, 3 Love, 4 Zen. Each step now has full series: Witness has the Ashtavakra Maha Geeta (Hindi) and The Empty Boat (Chuang Tzu); Love has the Sufis and more in Hindi; Zen has The Book of Nothing, Bodhidharma and No Water, No Moon. “Next on the path” shows the first talk you haven’t heard. What you’ve already heard is kept, including talks whose address changed.</li><li>1.9.8: the box you’re typing in stays above the keyboard: in Steps, in Food and everywhere else. The tab bar steps aside while you type.</li><li>1.9.8: the app opens with the lamp. Its icon is now marked for Android’s full-size icons and opening screen, so the lamp fills the icon instead of sitting small in a white circle.</li><li>1.9.7: the Sunday look-back now lists each day of the week: calories and protein, and steps. Under each list, the week’s average over the days that were logged, with your target beside it and the difference in plain numbers. Days with nothing logged say so.</li><li>1.9.6: four new Stops about time: Now, Only now, Hands and Listen. They turn up through the day like the others, a small reminder that past and future are thoughts happening now.</li><li>1.9.5: entering steps is quicker. Type the number as your phone shows it (8,000, 8 000 or 8k all work; before, “8,000” was saved as 8). The keyboard’s Done saves, the old number is selected so you can type over it, yesterday can be filled in too, and tapping the Move ring itself opens it.</li><li>1.9.4: after a sitting, the closing-song offer stays for 30 minutes even if you close and reopen the app. It shows in Sit and on Today, and goes quietly after. Not now still clears it at once.</li><li>1.9.4: every sitting is named: Gauri Shankar, Kundalini, or Just sitting, in Recent and in the messages after you stop or remove one.</li><li>1.9.3: the workout screen fits on the phone before and after the warm-up. The three warm-up moves come one at a time, and the safety line and Previous / Next sit straight under the sets, above the tab bar.</li><li>1.9.3: Backup AIs for photos now says plainly that a Groq key is free to create but Groq prices its inference, so photos read by Groq may be charged. Groq can also fall back to Qwen 3.6.</li><li>1.9.2: Sit now has Osho Kundalini beside Gauri Shankar: one hour, four stages, with its music in Spotify and the instructions from oshoworld.com.</li><li>1.9.2: a closing song after a sitting, Lokah Samasta by Deva Premal. It’s offered when you stop the timer and can be played from the meditation screen. All three links can be changed in You › Settings › Meditation music.</li><li>1.9.1: the photo AIs use the models Gemini, Groq and OpenRouter serve now. Gemini, like the other two, finds a new model by itself if one is retired.</li><li>1.9.1: with no AI keys set, the photo screen simply offers to paste the prompt into Claude. It no longer reads as if an estimate was tried.</li><li>1.9.1: journal entries brought over from the old Witness Journal are marked “from Witness Journal” in Entries.</li><li>1.9.0: entries written in the old Witness Journal app now appear in Practice › Write › Entries. This happens once; the old journal is left as it was.</li><li>1.9.0: tapping a tab at the bottom always opens that tab’s home. Back buttons inside pages still go one step up.</li><li>Groq now uses its Qwen vision model; the Llama 4 models were retired by Groq. If a model is retired again, Prakash looks up what Groq and OpenRouter offer and tries those.</li><li>Train: each exercise is logged in its own unit. Planks and the wall sit in seconds, with a Time a hold button; crunches, dead bugs and knee raises as reps only; the suitcase carry in kg and metres; the walk in minutes.</li><li>Rings without a target show just the thin track and the number, never a filled arc. Move and Still minutes are targets you set in Goals and your day, empty until you do.</li><li>Train: ticking a set copies its kg and reps into the empty sets after it. You can still change them.</li><li>A workout in progress shows on Today as Continue, and on Train as a small Resume bar. The tabs keep working mid-workout and nothing is lost.</li><li>First open shows only the setup screen until it’s done.</li><li>Photo estimates ask Gemini, then Groq, then OpenRouter, 8 seconds each, and say which one answered. Tick the items that are right. Add optional Groq and OpenRouter keys in You › Settings › Backup AIs for photos.</li><li>If no AI answers, one tap copies the prompt and opens Claude; paste the answer when you’re back.</li><li>Morning chai has its own card near the top of Today, from before you wake until late morning. The Stop no longer hides it.</li><li>Speak into Write: tap the microphone beside a journal question and your words appear in its box.</li><li>The Stop now waits as a card on Today. It never takes over the screen by itself; tap the card to open it full screen.</li><li>Train: a set is ticked only once kg and reps are both in. Moving to another exercise clears the rest timer. The day’s list shows every exercise, core moves included.</li><li>Food: Enter only shows matches; nothing is added without a tap. A general word like “dal” matched to a named dish is shown as “Did you mean…?”.</li><li>One word for hiding targets: Quiet mode, Quiet for today, Quiet until 6 pm. A day with nothing to log is now called just that.</li><li>The evening line can fill in the day: write “had dal and two rotis, walked 20 minutes, sat for the hour” and tick what to add.</li><li>Numbers as a mirror, not a judge. The rings and numbers stay; the words around them are plainer.</li><li>First open is one screen: your weight and when you wake, then Light the lamp. Targets stay empty until you set them.</li><li>Each morning Today opens with the lamp and the waking prayer. Empty rings say “not started” instead of dashes.</li><li>Food: matches appear as you type. Tap a food to add your usual portion; hold it to change the amount. Several foods separated by commas show together, with Add all.</li><li>Why your protein target is what it is, next to it on the Food page.</li><li>Train: next session filled in from last time, with weight added when every set reached the top of the range. A three-move warm-up, and last session’s numbers beside each exercise.</li><li>Steps: tap

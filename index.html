function lastDays(n){ const out=[]; const now=new Date(); for(let i=n-1;i>=0;i--){ out.push(todayKey(new Date(now.getFullYear(),now.getMonth(),now.getDate()-i))); } return out; }

function weekCharts(p){
  const days=lastDays(7);
  const DN=['Su','Mo','Tu','We','Th','Fr','Sa'];
  const data=days.map(k=>{ const dd=state.days[k]; const t=dd?totals(dd):{kcal:0,protein:0,fat:0}; return {k,t,dl:DN[new Date(k+'T12:00:00').getDay()]}; });
  function chart(title, get, target, color){
    const vals=data.map(x=>Math.round(get(x.t)));
    const max=Math.max(target||0, ...vals, 1);
    const W=350,H=116,padT=16,padB=18,ch=H-padT-padB,bw=28,gap=(W-7*bw)/8;
    let s='';
    vals.forEach((v,i)=>{ const h=Math.max(v>0?3:1, Math.round(v/max*ch)); const x=Math.round(gap+i*(bw+gap)); const y=padT+ch-h;
      s+=`<rect x="${x}" y="${y}" width="${bw}" height="${h}" rx="3" fill="${color}" opacity="${i===6?'1':'0.45'}"/>`;
      if(v>0) s+=`<text x="${x+bw/2}" y="${y-3}" text-anchor="middle" font-size="9" fill="#585254">${v}</text>`;
      s+=`<text x="${x+bw/2}" y="${H-4}" text-anchor="middle" font-size="9" fill="${i===6?'#251f21':'#969394'}">${data[i].dl}</text>`; });
    if(target){ const ty=Math.round(padT+ch-target/max*ch); s+=`<line x1="0" y1="${ty}" x2="${W}" y2="${ty}" stroke="#969394" stroke-dasharray="4 3" stroke-width="1"/>`; }
    return `<p class="dim" style="margin:10px 0 2px">${title}${target?` <span class="tiny">(dashed line: ${target} target)</span>`:''}</p><svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block" role="img" aria-label="${title} by day, last 7 days">${s}</svg>`;
  }
  const g=macroGoals(p);
  return chart('Calories, kcal', t=>t.kcal, p.kcalTarget, '#251f21')+chart('Protein, g', t=>t.protein, g.proteinG, '#73a89a')+chart('Fat, g', t=>t.fat, g.fatG, '#d9a441')+chart('Carbs, g', t=>t.carbs, g.carbG, '#6f7fbf')+chart('Fibre, g', t=>t.fibre||0, FIBRE_GOAL, '#8a6fbf');
}

function macrosHtml(p){
  const g=macroGoals(p);

  if(macroScope==='week'){ t={kcal:0,protein:0,fat:0,carbs:0}; for(const kk of lastDays(7)){ const dd=state.days[kk]; if(!dd) continue; const x=totals(dd); t.kcal+=x.kcal; t.protein+=x.protein; t.fat+=x.fat; t.carbs+=x.carbs; } }

    off+=len; }
  const legend=parts.map(x=>{ const pct=Math.round(x.k/totK*100); const gpct=Math.round(x.goalG*({Carbs:4,Fat:9,Protein:4}[x.n])/goalK*100);

}

function downscaleImage(file, maxDim, qual){ return new Promise((res,rej)=>{
  const reader=new FileReader();
  reader.onload=()=>{ const img=new Image();
    img.onload=()=>{ const max=maxDim||1024, scale=Math.min(1,max/Math.max(img.width,img.height));
      const w=Math.max(1,Math.round(img.width*scale)), h=Math.max(1,Math.round(img.height*scale));
      const c=document.createElement('canvas'); c.width=w; c.height=h;
      c.getContext('2d').drawImage(img,0,0,w,h);
      res(c.toDataURL('image/jpeg',qual||0.8)); };
    img.onerror=()=>rej(new Error('img')); img.src=String(reader.result); };
  reader.onerror=()=>rej(new Error('read')); reader.readAsDataURL(file); }); }

  const evts=(state.events||(state.events=[]));
  const wkEv=evts.filter(e=>keys.indexOf(e.date)>=0);
  const wkTarget=p.kcalTarget*7+wkEv.reduce((a,e)=>a+(e.extra||0),0);
  let consumed=0, prot=0, fib=0;
  const dayVals=keys.map(k=>{ const dd=state.days[k]; if(dd&&dd.foods&&dd.foods.length){ const t=totals(dd); consumed+=t.kcal; prot+=t.protein; fib+=t.fibre||0; return t.kcal; } return 0; });
  const remaining=wkTarget-consumed;
  const daysLeft=7-dow;
  const DN=['Mo','Tu','We','Th','Fr','Sa','Su'];
  const max=Math.max(p.kcalTarget*1.2, ...dayVals, 1);
  let bars='';
  dayVals.forEach((v,i)=>{ const extra=wkEv.filter(e=>e.date===keys[i]).reduce((a,e)=>a+(e.extra||0),0); const target=p.kcalTarget+extra;

function detectPatterns(){
  const out=[], days=lastDays(28), fortnight=lastDays(14);
  const snackTrigs={}; let snackN=0, lateDays=0, tiredDays=0, tiredSnackDays=0, bedLogs=0, lateBeds=0, sleepLogs=0, shortSleep=0;
  for(const kk of days){

    for(const f of (dd.foods||[])){
      if(f.snack){ snacks++; snackN++; const tr=f.trigger||'Real hunger'; snackTrigs[tr]=(snackTrigs[tr]||0)+1; }

    }
    if(late && fortnight.indexOf(kk)>=0) lateDays++;
    if(dd.mood==='\u{1F634} Tired'){ tiredDays++; if(snacks>0) tiredSnackDays++; }
    if(dd.bedTime){ bedLogs++; if(dd.bedTime>'22:15') lateBeds++; }
    if(dd.sleep!=null){ sleepLogs++; if(dd.sleep<7) shortSleep++; }
  }
  const top=Object.keys(snackTrigs).sort((a,b)=>snackTrigs[b]-snackTrigs[a])[0];
  if(top && top!=='Real hunger' && snackTrigs[top]>=4 && snackTrigs[top]>=snackN*0.4)
    out.push({t:'Snacks often arrive as '+top.toLowerCase(), b:'When '+top.toLowerCase()+' shows up, that is the moment the pause was built for. Notice it, breathe once, then choose. The snack after noticing is fine - the noticing is the practice.'});
  if(tiredDays>=3 && tiredSnackDays>=Math.ceil(tiredDays*0.6))
    out.push({t:'Snacks follow tired days', b:'Tired days and snacks travel together here. Nothing to fix - seeing the link is enough for now. Rest first, then decide.'});
  if(lateDays>=3)
    out.push({t:'Eating past 7 pm', b:'Dinner is landing late on several days this fortnight. The 10 pm sleep likes an earlier plate. Just notice what pushes it late.'});
  if(bedLogs>=4 && lateBeds>=3)
    out.push({t:'Bedtime drifting past 10', b:'Bedtime has slipped a few times recently. The 8:30 wind-down is the gentle lever: dim lights, slow down, gratitude.'});
  if(sleepLogs>=4 && shortSleep>=3)
    out.push({t:'Nights under seven hours', b:'Several short nights lately. The rhythm asks for the 10 pm side, not more willpower at 4:15.'});
  let shortN=0, shortSnack=0;
  const trainDates={}; for(const w of state.workouts) trainDates[w.date]=true;
  const trainK=[], restK=[];
  for(let i=0;i<days.length;i++){
    const kk=days[i]; const dd=state.days[kk]; if(!dd) continue;
    if((dd.foods||[]).length){ const t=totals(dd); if(trainDates[kk]) trainK.push(t.kcal); else restK.push(t.kcal); }
    if(dd.sleep!=null && dd.sleep<7 && i+1<days.length){
      shortN++;
      const nd=state.days[days[i+1]];
      if(nd && (nd.foods||[]).filter(f=>f.snack).length>=2) shortSnack++;
    }
  }
  if(shortN>=4 && shortSnack>=Math.ceil(shortN*0.6))
    out.push({t:'Snacks lean on short nights', b:'After nights under seven hours, the next day tends to bring more snacks here. The kindest fix is upstream: the 10 pm side of the night. Nothing to force - just see it.'});
  if(trainK.length>=3 && restK.length>=4){
    const avg=a=>a.reduce((s,x)=>s+x,0)/a.length;
    if(avg(restK)-avg(trainK)>=150)
      out.push({t:'Rest days eat richer than training days', b:'On days without a session, intake is running higher than on training days. Rest days still need feeding - the repair happens there. Just notice whether the extra is hunger or habit.'});
  }
  if(bedLogs>=4 && lateBeds>=3){
    let lateBoth=0;
    for(const kk of days){ const dd=state.days[kk]; if(!dd||!dd.bedTime||dd.bedTime<='22:15') continue; let late=false; for(const f of (dd.foods||[])){ if(f.ts && new Date(f.ts).getHours()>=19){ late=true; break; } } if(late) lateBoth++; }
    if(lateBoth>=Math.ceil(lateBeds*0.7))
      out.push({t:'Late plates and late nights travel together', b:'Most of the late nights here also had food logged after 7 pm. The earlier plate is the gentle lever for the 10 pm bedtime.'});
  }

}

function bell(){ try{ const AC=window.AudioContext||window.webkitAudioContext; const ctx=new AC();
  const o=ctx.createOscillator(), g=ctx.createGain(); o.type='sine'; o.frequency.value=528;
  g.gain.setValueAtTime(0.001,ctx.currentTime); g.gain.exponentialRampToValueAtTime(0.25,ctx.currentTime+0.05); g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+3);
  o.connect(g); g.connect(ctx.destination); o.start(); o.stop(ctx.currentTime+3.2); }catch(e){}
  try{ if(navigator.vibrate) navigator.vibrate(300); }catch(e){} }

    const missing=[]; for(const kk of Object.keys(state.days)){ for(const f of (state.days[kk].foods||[])){ if(f.fat==null||f.carbs==null) missing.push({dayKey:kk,id:f.id,name:f.name,kcal:f.kcal,protein:f.protein,needFat:f.fat==null,needCarbs:f.carbs==null}); } }
    if(!missing.length){ backfillList=[]; TAB_RENDER.data(); return; }
    function estimate(m){ const st=STAPLES.find(s=>m.name.indexOf(s[0])===0); if(st){ return {fat:Math.round(m.kcal*st[3]/st[1]*10)/10, carbs:Math.round(m.kcal*st[4]/st[1]*10)/10, src:'matches '+st[0]}; }
      const rem=Math.max(0, m.kcal-m.protein*4); return {fat:Math.round(rem*0.4/9*10)/10, carbs:Math.round(rem*0.6/4*10)/10, src:'estimate'}; }
    backfillList=missing.map(m=>Object.assign({}, m, estimate(m)));
    TAB_RENDER.data();
    if(p.geminiKey && backfillList.some(it=>it.src==='estimate')){
      try{
        const items=backfillList.filter(it=>it.src==='estimate');
        const prompt='For each numbered dish, estimate total fat and carbohydrates in grams, consistent with the given calories and protein. Reply with ONLY a JSON array like [{"i":1,"fat":10,"carbs":40}].\n'+items.map((it,ix)=>(ix+1)+'. '+it.name+' - '+it.kcal+' kcal, '+it.protein+' g protein').join('\n');
        const r=await fetch('https://generativelanguage.googleapis.com/v1beta/models/'+GEMINI_MODEL+':generateContent',{method:'POST',headers:{'Content-Type':'application/json','x-goog-api-key':p.geminiKey},body:JSON.stringify({contents:[{parts:[{text:prompt}]}]})});
        const j=await r.json().catch(()=>null);
        if(r.ok){
          const txt=((j.candidates&&j.candidates[0]&&j.candidates[0].content&&j.candidates[0].content.parts)||[]).map(pp=>pp.text||'').join('');
          const m=txt.replace(/```json|```/g,'').match(/\[[\s\S]*\]/);
          if(m){ const arr=JSON.parse(m[0]); let n=0;
            for(const a of arr){ const it=items[(a.i|0)-1]; if(it&&isFinite(a.fat)&&isFinite(a.carbs)){ it.fat=Math.round(a.fat*10)/10; it.carbs=Math.round(a.carbs*10)/10; it.src='Gemini estimate'; n++; } }
            if(n) TAB_RENDER.data(); } } }catch(e){}
    } };
  if(q('#d-bf-cancel')) q('#d-bf-cancel').onclick=()=>{ backfillList=null; TAB_RENDER.data(); };
  if(q('#d-bf-apply')) q('#d-bf-apply').onclick=()=>{ let n=0;
    for(const it of backfillList){ const dd=state.days[it.dayKey]; if(!dd) continue; const f=(dd.foods||[]).find(x=>x.id===it.id); if(!f) continue;
      if(f.fat==null){ f.fat=it.fat; n++; } if(f.carbs==null){ f.carbs=it.carbs; } }
    save(); backfillList=null; TAB_RENDER.data(); toast('Filled in missing values - existing numbers were not changed.'); };
  function downloadCsv(fname, rows){ const csv=rows.map(r=>r.map(x=>{ x=String(x==null?'':x); return /[",\n]/.test(x)?'"'+x.replace(/"/g,'""')+'"':x; }).join(',')).join('\n'); const blob=new Blob([csv],{type:'text/csv'}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=fname; document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },500); }
  if(q('#d-csvlog')) q('#d-csvlog').onclick=()=>{ const rows=[['date','time','slot','name','grams','kcal','protein_g','fat_g','carbs_g','fibre_g','snack','trigger']]; Object.keys(state.days).sort().forEach(kk=>{ (state.days[kk].foods||[]).forEach(f=>{ const dt=f.ts?new Date(f.ts):null; rows.push([kk, dt?String(dt.getHours()).padStart(2,'0')+':'+String(dt.getMinutes()).padStart(2,'0'):'', f.slot||(f.snack?'snack':''), f.name, f.grams||0, f.kcal, f.protein, f.fat!=null?f.fat:'', f.carbs!=null?f.carbs:'', f.fibre!=null?f.fibre:'', f.snack?'yes':'no', f.trigger||'']); }); }); downloadCsv('prakash-food-log.csv', rows); toast('Food log downloaded.'); };
  if(q('#d-csvsum')) q('#d-csvsum').onclick=()=>{ const rows=[['date','kcal','protein_g','fat_g','carbs_g','fibre_g','water_glasses','steps','sleep_h','mood']]; Object.keys(state.days).sort().forEach(kk=>{ const dd=state.days[kk]; const t=totals(dd); rows.push([kk, t.kcal, t.protein, t.fat, t.carbs, t.fibre, dd.water||0, dd.steps||0, dd.sleep!=null?dd.sleep:'', dd.mood||'']); }); downloadCsv('prakash-daily-summary.csv', rows); toast('Daily summary downloaded.'); };
  async function completeBackup(){
    const out=JSON.parse(JSON.stringify(state)); let voices=0;
    if(out.witness&&Array.isArray(out.witness.entries)) for(const e of out.witness.entries){const a=await wget(e.id).catch(()=>null);if(a&&a.blob){e.audio={mimeType:a.blob.type||a.mime||'audio/webm',seconds:a.seconds||null,base64:await blob64(a.blob)};voices++;}}
    out.backup={format:'sadhana-v1',version:2,exported:new Date().toISOString(),includesWitnessAudio:true,voiceNotes:voices};
    const text=JSON.stringify(out,null,2),blob=new Blob([text],{type:'application/json'});if(!text.includes('"profile"')||blob.size<50)throw Error('backup');
    const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='prakash-backup-'+new Date().toISOString().slice(0,10)+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),5000);return {voices,size:blob.size};
  }
  q('#d-export').onclick=async()=>{try{const b=await completeBackup();toast('Complete backup downloaded with '+b.voices+' journal voice notes.');}catch(e){toast('Backup could not be prepared. Nothing was changed.');}};
  q('#d-health-import').onchange=e=>{
    const file=e.target.files&&e.target.files[0]; if(!file)return;
    const reader=new FileReader();
    reader.onload=()=>{ try{
      const lines=String(reader.result).replace(/^\uFEFF/,'').split(/\r?\n/).filter(x=>x.trim()); if(lines.length<2) throw new Error('empty');
      const parseRow=line=>{ const out=[]; let x='',quote=false; for(let i=0;i<line.length;i++){ const c=line[i]; if(c==='"'){ if(quote&&line[i+1]==='"'){x+='"';i++;}else quote=!quote; } else if(c===','&&!quote){out.push(x);x='';} else x+=c; } out.push(x); return out; };
      const head=parseRow(lines[0]).map(x=>x.trim().toLowerCase().replace(/[\s-]+/g,'_')); const ix=n=>head.indexOf(n), di=ix('date'); if(di<0) throw new Error('date');
      let n=0;
      for(const line of lines.slice(1)){ const r=parseRow(line), raw=(r[di]||'').trim(); if(!raw)continue; const d=new Date(raw), date=/^\d{4}-\d{2}-\d{2}/.test(raw)?raw.slice(0,10):(!isNaN(d)?d.toISOString().slice(0,10):''); if(!date)continue;
        const num=name=>{const i=ix(name),v=i<0?NaN:parseFloat(r[i]);return isNaN(v)?null:v;};
        let kg=num('weight_kg'); const lb=num('weight_lb'); if(kg==null&&lb!=null)kg=Math.round(lb*0.45359237*10)/10;
        let waist=num('waist_cm'); const waistIn=num('waist_in'); if(waist==null&&waistIn!=null)waist=Math.round(waistIn*2.54*10)/10;
        const steps=num('steps'),sleep=num('sleep_h');
        if(kg!=null&&kg>0){state.weights=state.weights.filter(x=>x.date!==date);state.weights.push({date,kg});n++;}
        if(waist!=null&&waist>0){state.waists=state.waists.filter(x=>x.date!==date);state.waists.push({date,cm:waist});n++;}
        if(steps!=null||sleep!=null){const dd=dayOf(date);if(steps!=null)dd.steps=Math.round(steps);if(sleep!=null)dd.sleep=sleep;n++;}
      }
      if(!n){toast('No supported health values were found. Check the column names.');return;} save();TAB_RENDER.data();toast('Health data imported: '+n+' values.');
    }catch(err){toast('Could not read that health CSV. Include a date column and supported headings.');} };
    reader.readAsText(file); e.target.value='';
  };
  q('#d-import').onchange=e=>{
    const file=e.target.files&&e.target.files[0]; if(!file)return;
    const reader=new FileReader();
    reader.onload=async()=>{ try{ const s=JSON.parse(String(reader.result));
        if(!s||s.v!==1||!s.profile){ toast('That file is not a Prakash backup.'); return; }
        if(s.witness&&Array.isArray(s.witness.entries))for(const e of s.witness.entries){if(e.audio&&e.audio.base64){await wput(e.id,{blob:b64blob(e.audio.base64,e.audio.mimeType),seconds:e.audio.seconds||null,mime:e.audio.mimeType||'audio/webm'});}delete e.audio;}
        state=s;if(!state.witness)state.witness={entries:[],readings:[],migration:null};save(); TAB_RENDER.data(); toast('Backup restored.'); }catch(err){ toast('Could not read that file.'); } };
    reader.readAsText(file); e.target.value='';
  };
  q('#d-fresh').onclick=async()=>{
    const b=q('#d-fresh'),status=q('#d-fresh-status');
    if(b.dataset.arm==='1'){
      const profile={...state.profile,setupDone:false};
      state={...seed(),profile,witness:{entries:[],readings:[],migration:null},awareness:{done:{},notes:{},generated:[]},events:[]};
      const db=await wdb().catch(()=>null);if(db)await new Promise(r=>{const x=db.transaction('notes','readwrite').objectStore('notes').clear();x.onsuccess=x.onerror=()=>r();});
      save();location.reload();return;
    }
    b.disabled=true;b.textContent='Preparing your complete backup…';
    try{const made=await completeBackup();b.disabled=false;b.dataset.arm='1';b.textContent='Confirm: clear logs and begin onboarding';status.innerHTML='<div class="fresh-confirm"><strong>Backup prepared and download started.</strong><br>'+made.voices+' journal voice notes included. Nothing has been cleared yet. Keep the downloaded file, then tap Confirm.</div>';}catch(e){b.disabled=false;b.textContent='Download backup and start fresh';status.innerHTML='<p class="note">The backup could not be prepared, so nothing was cleared.</p>';}
  };
  q('#d-setup').onclick=()=>{ showSetup(); };
};
/* ---------- first-run setup ---------- */
function calcAge(dob){
  if(!dob) return null;
  const d=new Date(dob+'T12:00:00'); if(isNaN(d)) return null;
  const now=new Date(); let a=now.getFullYear()-d.getFullYear();
  if(now.getMonth()<d.getMonth()||(now.getMonth()===d.getMonth()&&now.getDate()<d.getDate())) a--;
  return a>=0&&a<130?a:null;
}
function parseHeight(value){
  const raw=(value||'').trim().toLowerCase().replace(/\s+/g,''); if(!raw)return null;
  let cm=null,m;
  if((m=raw.match(/^(\d+(?:\.\d+)?)cm$/))) cm=parseFloat(m[1]);
  else if((m=raw.match(/^(\d+(?:\.\d+)?)m$/))) cm=parseFloat(m[1])*100;
  else if((m=raw.match(/^(\d+)(?:'|ft)(\d+(?:\.\d+)?)?(?:"|in)?$/))) cm=(parseInt(m[1],10)*12+parseFloat(m[2]||0))*2.54;
  else if((m=raw.match(/^(\d+):(\d+(?:\.\d+)?)$/))) cm=(parseInt(m[1],10)*12+parseFloat(m[2]))*2.54;
  else if(/^\d+(?:\.\d+)?$/.test(raw)) cm=parseFloat(raw);
  return cm>=90&&cm<=250?Math.round(cm*10)/10:null;
}
function displayHeight(cm){ return cm==null?'':Math.round(cm)+'cm'; }
let setupStep=0;
function showSetup(){
  const el=document.getElementById('setup'),box=el.querySelector('.inner'),p=state.profile;
  const steps=[
    {k:'goal',title:'What are you working towards?',note:'Choose what matters.',body:`${[['Lose fat gently','fat-loss'],['Build strength and muscle','strength'],['Maintain health and energy','maintain'],['Move and feel better','wellbeing']].map(x=>`<button class="onboard-choice${p.primaryGoal===x[1]?' on':''}" data-pick="primaryGoal" data-value="${x[1]}">${x[0]}</button>`).join('')}<div class="field"><label class="label">Goal weight (kg)</label><input class="input" inputmode="decimal" id="ob-goal" value="${p.goalWeight==null?'':p.goalWeight}"></div>`},
    {k:'body',title:'Your starting point',note:'The useful basics.',body:`<div class="field"><label class="label">Date of birth</label><input class="input" type="date" id="ob-dob" max="${todayKey()}" value="${p.dob||''}"></div><div class="field"><label class="label">Height</label><input class="input" id="ob-height" placeholder="178cm or 5'10&quot;" value="${displayHeight(p.heightCm)}"></div><div class="field"><label class="label">Current weight (kg)</label><input class="input" inputmode="decimal" id="ob-weight" value="${p.startWeight==null?'':p.startWeight}"></div>`},
    {k:'targets',title:'Your daily anchors',note:'Confirm or adjust.',body:`<div class="field"><label class="label">Calories (kcal)</label><input class="input" inputmode="numeric" id="ob-kcal" value="${p.kcalTarget||1700}"></div><div class="field"><label class="label">Protein (g)</label><input class="input" inputmode="numeric" id="ob-protein" value="${p.proteinTarget||130}"></div><div class="field"><label class="label">Water (glasses)</label><input class="input" inputmode="numeric" id="ob-water" value="${p.waterTarget||8}"></div><div class="field"><label class="label">Steps</label><input class="input" inputmode="numeric" id="ob-steps" value="${p.stepsTarget||8000}"></div>`},
    {k:'training',title:'How do you want to train?',note:'Choose your rhythm.',body:`${[[2,'2 strength days'],[3,'3 strength days'],[4,'3 strength + optional recovery day']].map(x=>`<button class="onboard-choice${Number(p.trainingDays||3)===x[0]?' on':''}" data-pick="trainingDays" data-value="${x[0]}">${x[1]}</button>`).join('')}<label class="check"><input type="checkbox" id="ob-bp"${p.bpSafe?' checked':''}><span>Show the blood-pressure-safe lifting and breathwork rules</span></label>`},
    {k:'food',title:'How do you prefer to eat?',note:'Choose what fits.',body:`<label class="check"><input type="checkbox" id="ob-veg"${p.vegetarian!==false?' checked':''}><span>Vegetarian</span></label><label class="check"><input type="checkbox" id="ob-eggfree"${p.eggFree!==false?' checked':''}><span>Egg-free</span></label>`}
  ],st=steps[setupStep];
  box.innerHTML=`<h1>Prakash</h1><p class="tag">Made for you.</p><div class="onboard-progress">${steps.map((_,i)=>`<i class="${i<=setupStep?'on':''}"></i>`).join('')}</div><p class="tiny">${setupStep+1} of ${steps.length}</p><h2>${st.title}</h2><p class="note">${st.note}</p>${st.body}<div class="qr" style="margin-top:20px">${setupStep?'<button class="btn" id="ob-back">Back</button>':''}<button class="btn primary" id="ob-next">${setupStep===steps.length-1?'Finish':'Continue'}</button></div><button class="btn" id="ob-skip" style="margin-top:10px">Set up later</button>`;
  el.classList.add('open');const q=x=>box.querySelector(x);
  box.querySelectorAll('[data-pick]').forEach(b=>b.onclick=()=>{p[b.dataset.pick]=b.dataset.pick==='trainingDays'?Number(b.dataset.value):b.dataset.value;box.querySelectorAll(`[data-pick="${b.dataset.pick}"]`).forEach(x=>x.classList.toggle('on',x===b));});
  if(q('#ob-back'))q('#ob-back').onclick=()=>{setupStep--;showSetup();};
  q('#ob-skip').onclick=()=>el.classList.remove('open');
  q('#ob-next').onclick=()=>{
    if(st.k==='goal'){const n=parseFloat(q('#ob-goal').value);if(!isNaN(n))p.goalWeight=n;}
    if(st.k==='body'){const dob=q('#ob-dob').value,age=calcAge(dob),cm=parseHeight(q('#ob-height').value),wt=parseFloat(q('#ob-weight').value);if(dob&&age==null){toast('Add a valid date of birth.');return}if(q('#ob-height').value&&cm==null){toast('Add height as centimetres or feet and inches.');return}if(dob){p.dob=dob;p.age=age}if(cm)p.heightCm=cm;if(!isNaN(wt)){p.startWeight=wt;p.startDate=todayKey();}}
    if(st.k==='targets'){[['kcalTarget','#ob-kcal'],['proteinTarget','#ob-protein'],['waterTarget','#ob-water'],['stepsTarget','#ob-steps']].forEach(x=>{const n=parseInt(q(x[1]).value,10);if(n>0)p[x[0]]=n;});}
    if(st.k==='training')p.bpSafe=q('#ob-bp').checked;
    if(st.k==='food'){p.vegetarian=q('#ob-veg').checked;p.eggFree=q('#ob-eggfree').checked;}
    save();if(setupStep<steps.length-1){setupStep++;showSetup();}else{p.setupDone=true;p.onboardingVersion=34;save();el.classList.remove('open');TAB_RENDER.today();window.scrollTo(0,0);}
  };
}
/* ---------- boot ---------- */
TAB_RENDER.today();
if(!state.profile.setupDone) showSetup();
</script>
<script>
if ('serviceWorker' in navigator) {
  // If a new service worker takes control while this page is open, reload once
  // so the new app version is shown. Skipped on first-ever install (nothing
  // controlled this page before) so first use never double-loads.
  var hadController = !!navigator.serviceWorker.controller;
  var reloading = false;
  navigator.serviceWorker.addEventListener('controllerchange', function(){
    if (!hadController || reloading) return;
    reloading = true;
    window.location.reload();
  });
  window.addEventListener('load', function(){
    // updateViaCache:'none' makes update checks bypass the HTTP cache, so a new
    // sw.js is seen within minutes of a deploy instead of after cache expiry.
    navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).then(function(reg){
      reg.update().catch(function(){});
      document.addEventListener('visibilitychange', function(){ if (!document.hidden) reg.update().catch(function(){}); });
    }).catch(function(){});
  });
}
</script>

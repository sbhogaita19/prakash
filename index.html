:root { --ink:#251f21; --ink2:#585254; --ink3:#969394; --hair:#eae9ea; --teal:#73a89a; --red:#ed313e; --sand:#f4efec; --page:#fbfaf9; }
* { box-sizing: border-box; }
body { margin:0; background:var(--page); color:var(--ink); font-family:-apple-system,'Helvetica Neue',Arial,sans-serif; font-size:15px; line-height:1.5; }
.wrap { max-width:640px; margin:0 auto; padding:18px 16px 90px; }
h1 { font-family:Georgia,'Times New Roman',serif; font-weight:400; font-size:30px; letter-spacing:-0.02em; margin:8px 0 2px; }
.tag { color:var(--ink2); font-size:14px; margin:0 0 8px; }
.intro { color:var(--ink); font-size:15px; line-height:24px; margin:0 0 14px; }
nav.tabs { display:flex; gap:16px; border-bottom:1px solid var(--hair); overflow-x:auto; position:sticky; top:0; background:var(--page); z-index:5; -webkit-overflow-scrolling:touch; }
nav.tabs button { flex:0 0 auto; border:none; background:none; padding:12px 2px; min-height:44px; font-size:15px; color:var(--ink2); cursor:pointer; font-family:inherit; }
nav.tabs button.on { color:var(--ink); box-shadow:inset 0 -2px 0 var(--ink); font-weight:600; }
section.tab { display:none; }
section.tab.on { display:block; }
h2 { font-family:Georgia,serif; font-weight:400; font-size:21px; letter-spacing:-0.02em; margin:26px 0 6px; }
h3 { font-size:15px; margin:0; }
.slothead { margin:12px 0 4px; }
.note { color:var(--ink2); font-size:14px; line-height:21px; margin:8px 0; }
.dim { color:var(--ink2); font-size:13px; }
.tiny { font-size:12px; color:var(--ink3); }
.grid2 { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin:10px 0; }
.stat { border:1px solid var(--hair); border-radius:8px; padding:10px 12px; }

.stat .v { font-size:17px; font-weight:600; margin:2px 0 6px; }
.bar { height:6px; border-radius:3px; background:var(--sand); overflow:hidden; }
.bar i { display:block; height:100%; background:var(--teal); border-radius:3px; }
.btn { display:inline-flex; align-items:center; justify-content:center; min-height:44px; padding:8px 16px; border-radius:6px; border:1px solid var(--hair); background:#fff; color:var(--ink); font-size:15px; cursor:pointer; font-family:inherit; text-decoration:none; }
.btn.primary { background:var(--ink); border-color:var(--ink); color:#fff; }
.btn.danger { color:var(--red); border-color:#f5aaae; }

.qr { display:flex; flex-wrap:wrap; gap:10px; margin:10px 0; }
.field { margin:10px 0; }
.label { display:block; color:var(--ink2); font-size:13px; margin-bottom:4px; }

.list { display:flex; flex-direction:column; margin:8px 0; }

.rowc { flex-direction:column; align-items:flex-start; gap:2px; }
.rowbtn { display:flex; flex-direction:column; align-items:flex-start; gap:2px; width:100%; text-align:left; padding:10px 6px; border:none; border-bottom:1px solid var(--hair); background:none; font-size:15px; color:var(--ink); cursor:pointer; min-height:44px; font-family:inherit; }
.del { border:none; background:none; color:var(--red); font-size:13px; cursor:pointer; padding:8px 4px; min-height:44px; font-family:inherit; }
.tagchip { display:inline-block; margin-left:6px; padding:1px 8px; border-radius:10px; background:var(--sand); color:var(--ink2); font-size:12px; }
.card { border:1px solid var(--hair); border-radius:8px; padding:12px; margin:10px 0; }
.cardhead { display:flex; width:100%; justify-content:space-between; align-items:center; border:none; background:none; padding:6px 0; min-height:44px; font-size:15px; color:var(--ink); cursor:pointer; font-family:inherit; }
.setrow { display:flex; align-items:center; gap:8px; margin:6px 0; }
.searchrow { display:flex; gap:8px; margin:8px 0; }
.searchrow .input { flex:1; }
.pickbox { border:1px solid var(--teal); border-radius:8px; padding:12px; margin:10px 0; display:flex; flex-direction:column; gap:6px; }
.quote { border-left:3px solid var(--teal); padding:4px 0 4px 14px; margin:8px 0 14px; }
.quote .t { font-size:16px; line-height:24px; }
.quote .b { color:var(--ink2); font-size:13px; margin-top:4px; }
.breath { font-size:16px; margin:8px 0; }
.facts { display:flex; flex-direction:column; margin:8px 0; }
.fact { display:flex; justify-content:space-between; gap:12px; padding:8px 0; border-bottom:1px solid var(--hair); }
.fact span { color:var(--ink2); }
.fact strong { text-align:right; }
.timer { font-family:Georgia,serif; font-size:56px; text-align:center; margin:14px 0; }
.check { display:flex; align-items:center; gap:10px; min-height:44px; padding:6px 0; border-bottom:1px solid var(--hair); cursor:pointer; }
.check input { width:20px; height:20px; accent-color:var(--teal); }
.check.done span { color:var(--ink3); text-decoration:line-through; }
.photogrid { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin:10px 0; }
.photo img { width:100%; border-radius:8px; display:block; }
.dishpreview { width:100%; max-height:280px; object-fit:cover; border-radius:8px; margin:8px 0; display:block; }
.photofoot { display:flex; justify-content:space-between; align-items:center; }
.filebtn { position:relative; overflow:hidden; }
.filebtn input[type=file] { position:absolute; inset:0; opacity:0; cursor:pointer; }
.callout { background:var(--sand); border-radius:8px; padding:12px 14px; margin:10px 0; }
.callout strong { display:block; margin-bottom:6px; }
ul.plain { margin:6px 0; padding-left:20px; line-height:24px; }
.chartbox { border:1px solid var(--hair); border-radius:8px; padding:10px; margin:10px 0; }
.closing { color:var(--ink2); font-size:13px; border-top:1px solid var(--hair); margin-top:28px; padding-top:12px; }
a { color:var(--ink); }
#setup { display:none; position:fixed; inset:0; background:var(--page); z-index:100; overflow-y:auto; padding:18px 16px 90px; }
#setup.open { display:block; }
#setup .inner { max-width:640px; margin:0 auto; }

  <details class="card fold"><summary>What's new &middot; v66</summary><ul class="plain">
    <li>The lamp: a small diya at the top of Today. One tap lights it for the day; a new day begins unlit. No count, no streak, no history - a ceremony, not a counter.</li>
    <li>Talks: chapters are simply read now - no ticks, no lamps, no counters between them. One gesture remains: finishing a whole series, marked with a swipe or a tap. Thoughts on a series can be written once it rests complete.</li>
    <li>Prayers: one daily acknowledgment - prayer happened today, acknowledged, then let go. Nothing is counted and nothing accumulates.</li>
    <li>The Journal asks better questions now: nothing to answer correctly - each one turns on love, witness or awareness, one question leading to the next, from the moment, to what the mind made of it, to what was already here.</li>
  </ul></details>
  <details class="card fold"><summary>What's new &middot; v65</summary><ul class="plain">
    <li>The Stop can now reach you as a quiet notification: no sound, no buzz - it waits in the shade, and tapping it opens the Stop. Ask from the Remember card ("Let the bell reach you"). Your phone's focus and driving modes still apply. Honest limit: a signal can reach you while the app is open or in the background - fully closed, it waits for your next open.</li>
    <li>Workouts are timed from start to finish. The clock survives the app closing, and the finished session shows its minutes.</li>
    <li>Workout counts sit beside the sits under Mind &gt; Practice: this week and all time, as plain facts.</li>
    <li>The Yoga and mobility section has left Train. In its place, finishing a workout offers a quiet five-minute stretch list - read it or light the rows, no timer, nothing counted.</li>
  </ul></details>
  <details class="card fold"><summary>What's new &middot; v64</summary><ul class="plain">
    <li>The Stop, under Mind &gt; Practice: a few unpredictable self-remembering signals a day - sometimes none, never on the hour - inside a window you choose. Rotating forms: Stop, I am, Where is your attention. No timer, no chime, and no record kept.</li>
    <li>Honest mechanism: a web app cannot be woken for a push here, so a signal appears while the app is open or the next time you open it.</li>
    <li>When anger comes: a three-step pause for the moment itself, ending in one optional plain-fact line into the Journal. A wait-before-replying note sits alongside, labelled as Osho's retelling.</li>
    <li>Self-remembering, briefly: the essence after Gurdjieff, in the app's own words. This app can be a signal, never a teacher.</li>
  </ul></details>
  <details class="card fold"><summary>What's new &middot; v63</summary><ul class="plain">
    <li>A workout in progress, a journal entry being written and gratitude lines now save as you type and reopen where you left off. Closing a workout with sets logged asks first.</li>
    <li>App updates wait while a workout or journal entry is open, so nothing mid-write is interrupted.</li>
    <li>Truths shows the day's blood-pressure reading correctly.</li>
    <li>Prakash now asks the phone to protect the app's storage from automatic clearing.</li>
    <li>Foods sit inside their meal cards with a kcal subtotal. Tap a food for its actions. Repeat yesterday appears only when yesterday had that meal.</li>
    <li>Fact rows have breathing room; the waist date has its own row; body figures appear after the first logged workout.</li>
    <li>Walk and sleep timers use the same quiet serif as the meditation timer.</li>
    <li>Gauri Shankar instructions from Osho World, under Mind &gt; Practice.</li>
    <li>A sit is removed only by a clear sideways swipe that follows your finger.</li>
    <li>Shorter instruction lines, consistent numbers and quotes, and talk chapters no longer count progress.</li>
    <li>On a weak signal the saved copy of the app opens after a couple of seconds instead of waiting on the network.</li>
  </ul></details>

    <li>Google Health Connect steps cannot be read by this web app, so steps stay manual. Direct sync would require a separate native Android app and explicit Health Connect permission.</li>
    <li>Add Prakash to your home screen from the browser menu (Add to Home screen). It then opens full screen like an app and works offline.</li>

      const db=await wdb().catch(()=>null);if(db)await new Promise(r=>{const x=db.transaction('notes','readwrite').objectStore('notes').clear();x.onsuccess=x.onerror=()=>r();});
      save();location.reload();return;
    }
    b.disabled=true;b.textContent='Preparing your complete backup…';
    try{const made=await completeBackup();b.disabled=false;b.dataset.arm='1';b.textContent='Confirm: clear logs and begin onboarding';status.innerHTML='<div class="fresh-confirm"><strong>Backup prepared and download started.</strong><br>'+made.voices+' journal voice notes included. Nothing has been cleared yet. Keep the downloaded file, then tap Confirm.</div>';}catch(e){b.disabled=false;b.textContent='Download backup and start fresh';status.innerHTML='<p class="note">The backup could not be prepared, so nothing was cleared.</p>';}
  };
  q('#d-setup').onclick=()=>{ showSetup(); };
};

function calcAge(dob){
  if(!dob) return null;
  const d=new Date(dob+'T12:00:00'); if(isNaN(d)) return null;
  const now=new Date(); let a=now.getFullYear()-d.getFullYear();
  if(now.getMonth()<d.getMonth()||(now.getMonth()===d.getMonth()&&now.getDate()<d.getDate())) a--;
  return a>=0&&a<130?a:null;
}
function parseHeight(value){
  const raw=(value||'').trim().toLowerCase().replace(/\s+/g,''); if(!raw)return null;
  let cm=null,m;
  if((m=raw.match(/^(\d+(?:\.\d+)?)cm$/))) cm=parseFloat(m[1]);
  else if((m=raw.match(/^(\d+(?:\.\d+)?)m$/))) cm=parseFloat(m[1])*100;
  else if((m=raw.match(/^(\d+)(?:'|ft)(\d+(?:\.\d+)?)?(?:"|in)?$/))) cm=(parseInt(m[1],10)*12+parseFloat(m[2]||0))*2.54;
  else if((m=raw.match(/^(\d+):(\d+(?:\.\d+)?)$/))) cm=(parseInt(m[1],10)*12+parseFloat(m[2]))*2.54;
  else if(/^\d+(?:\.\d+)?$/.test(raw)) cm=parseFloat(raw);
  return cm>=90&&cm<=250?Math.round(cm*10)/10:null;
}
function displayHeight(cm){ return cm==null?'':Math.round(cm)+'cm'; }
let setupStep=0;
function showSetup(){
  const el=document.getElementById('setup'),box=el.querySelector('.inner'),p=state.profile;
  const steps=[
    {k:'modules',title:'What do you want to be aware of?',note:'Choose what you want to see. Everything else sleeps and can be woken later.',body:`<div class="module-list">${[['food','Food','Meals, water and the pause before eating'],['train','Training','Workouts, sets and rest timer'],['body','Body','Weight, waist, sleep and blood pressure'],['mind','Mind / Journal','Meditation, journal and the bell'],['spiritual','Prayers / Talks','Prayers and talks to return to']].map(x=>`<button class="onboard-choice module-pick${modules()[x[0]]?' on':''}" data-module-pick="${x[0]}" aria-pressed="${!!modules()[x[0]]}"><span class="mp-text"><strong>${x[1]}</strong><small>${x[2]}</small></span><span class="mp-state">${modules()[x[0]]?'On':'Off'}</span></button>`).join('')}</div>`},
    {k:'goal',title:'What are you working towards?',note:'Choose what matters.',body:`${[['Lose fat gently','fat-loss'],['Build strength and muscle','strength'],['Maintain health and energy','maintain'],['Move and feel better','wellbeing']].map(x=>`<button class="onboard-choice${p.primaryGoal===x[1]?' on':''}" data-pick="primaryGoal" data-value="${x[1]}">${x[0]}</button>`).join('')}<div class="field"><label class="label">Goal weight (kg)</label><input class="input" inputmode="decimal" id="ob-goal" value="${p.goalWeight==null?'':p.goalWeight}"></div>`},
    {k:'body',title:'Your starting point',note:'The useful basics.',body:`<div class="field"><label class="label">Date of birth</label><input class="input" type="date" id="ob-dob" max="${todayKey()}" value="${p.dob||''}"></div><div class="field"><label class="label">Height</label><input class="input" id="ob-height" placeholder="178cm or 5'10&quot;" value="${displayHeight(p.heightCm)}"></div><div class="field"><label class="label">Current weight (kg)</label><input class="input" inputmode="decimal" id="ob-weight" value="${p.startWeight==null?'':p.startWeight}"></div>`},
    {k:'targets',title:'Your daily anchors',note:'Confirm or adjust.',body:`<div class="field"><label class="label">Calories (kcal)</label><input class="input" inputmode="numeric" id="ob-kcal" value="${p.kcalTarget||1700}"></div><div class="field"><label class="label">Protein (g)</label><input class="input" inputmode="numeric" id="ob-protein" value="${p.proteinTarget||130}"></div><div class="field"><label class="label">Water (glasses)</label><input class="input" inputmode="numeric" id="ob-water" value="${p.waterTarget||8}"></div><div class="field"><label class="label">Steps</label><input class="input" inputmode="numeric" id="ob-steps" value="${p.stepsTarget||8000}"></div>`},
    {k:'training',title:'How do you want to train?',note:'Choose your rhythm.',body:`${[[2,'2 strength days'],[3,'3 strength days'],[4,'3 strength + optional recovery day']].map(x=>`<button class="onboard-choice${Number(p.trainingDays||3)===x[0]?' on':''}" data-pick="trainingDays" data-value="${x[0]}">${x[1]}</button>`).join('')}<label class="check"><input type="checkbox" id="ob-bp"${p.bpSafe?' checked':''}><span>Show the blood-pressure-safe lifting and breathwork rules</span></label>`},
    {k:'food',title:'How do you prefer to eat?',note:'Choose what fits.',body:`<label class="check"><input type="checkbox" id="ob-veg"${p.vegetarian!==false?' checked':''}><span>Vegetarian</span></label><label class="check"><input type="checkbox" id="ob-eggfree"${p.eggFree!==false?' checked':''}><span>Egg-free</span></label>`}
  ].filter(x=>{const m=modules();return !((x.k==='training'&&!m.train)||(x.k==='food'&&!m.food));}),st=steps[Math.min(setupStep,steps.length-1)];
  box.innerHTML=`<h1><img src="prakash-om-192.png" alt="Om" width="48" height="48" style="display:block;border-radius:12px;margin-bottom:10px">Prakash</h1><p class="tag">Made for you.</p><div class="onboard-progress">${steps.map((_,i)=>`<i class="${i<=setupStep?'on':''}"></i>`).join('')}</div><p class="tiny">${setupStep+1} of ${steps.length}</p><h2>${st.title}</h2><p class="note">${st.note}</p>${st.body}<div class="qr" style="margin-top:20px">${setupStep?'<button class="btn" id="ob-back">Back</button>':''}<button class="btn primary" id="ob-next">${setupStep===steps.length-1?'Finish':'Continue'}</button></div><button class="btn" id="ob-skip" style="margin-top:10px">Set up later</button>`;
  el.classList.add('open');const q=x=>box.querySelector(x);
  box.querySelectorAll('[data-module-pick]').forEach(b=>b.onclick=()=>{const m=modules();m[b.dataset.modulePick]=!m[b.dataset.modulePick];p.modules=m;b.classList.toggle('on',m[b.dataset.modulePick]);b.setAttribute('aria-pressed',String(!!m[b.dataset.modulePick]));b.querySelector('.mp-state').textContent=m[b.dataset.modulePick]?'On':'Off';});
  box.querySelectorAll('[data-pick]').forEach(b=>b.onclick=()=>{p[b.dataset.pick]=b.dataset.pick==='trainingDays'?Number(b.dataset.value):b.dataset.value;box.querySelectorAll(`[data-pick="${b.dataset.pick}"]`).forEach(x=>x.classList.toggle('on',x===b));});
  if(q('#ob-back'))q('#ob-back').onclick=()=>{setupStep--;showSetup();};
  q('#ob-skip').onclick=()=>{if(!p.setupDone){p.setupDone=true;p.setupSkipped=true;save();}el.classList.remove('open');TAB_RENDER.today();};
  q('#ob-next').onclick=()=>{
    if(st.k==='modules'){applyModules();}
    if(st.k==='goal'){const n=parseFloat(q('#ob-goal').value);if(!isNaN(n))p.goalWeight=n;}
    if(st.k==='body'){const dob=q('#ob-dob').value,age=calcAge(dob),cm=parseHeight(q('#ob-height').value),wt=parseFloat(q('#ob-weight').value);if(dob&&age==null){toast('Add a valid date of birth.');return}if(q('#ob-height').value&&cm==null){toast('Add height as centimetres or feet and inches.');return}if(dob){p.dob=dob;p.age=age}if(cm)p.heightCm=cm;if(!isNaN(wt)){p.startWeight=wt;p.startDate=todayKey();}}
    if(st.k==='targets'){[['kcalTarget','#ob-kcal'],['proteinTarget','#ob-protein'],['waterTarget','#ob-water'],['stepsTarget','#ob-steps']].forEach(x=>{const n=parseInt(q(x[1]).value,10);if(n>0)p[x[0]]=n;});}
    if(st.k==='training')p.bpSafe=q('#ob-bp').checked;
    if(st.k==='food'){p.vegetarian=q('#ob-veg').checked;p.eggFree=q('#ob-eggfree').checked;}
    save();if(setupStep<steps.length-1){setupStep++;showSetup();}else{p.setupDone=true;p.onboardingVersion=34;save();el.classList.remove('open');TAB_RENDER.today();window.scrollTo(0,0);}
  };
}

window.__pkHoldReload=function(){ return !!draft || mindView==='write'; };
try{ if(navigator.storage&&navigator.storage.persist) navigator.storage.persist().catch(function(){}); }catch(e){}
applyModules();TAB_RENDER.today();

if(!state.profile.setupDone) showSetup();
</script>
<script>
if ('serviceWorker' in navigator) {
  // If a new service worker takes control while this page is open, reload once
  // so the new app version is shown. Skipped on first-ever install (nothing
  // controlled this page before) so first use never double-loads.
  var hadController = !!navigator.serviceWorker.controller;
  var reloading = false, holdSince = 0;
  function tryReload(){
    if (reloading) return;
    var hold = window.__pkHoldReload && window.__pkHoldReload();
    if (hold) {
      if (!holdSince) holdSince = Date.now();
      if (Date.now() - holdSince < 15*60*1000) { setTimeout(tryReload, 45000); return; }
    }
    reloading = true;
    window.location.reload();
  }
  navigator.serviceWorker.addEventListener('controllerchange', function(){
    if (!hadController || reloading) return;
    tryReload();
  });
  window.addEventListener('load', function(){
    // updateViaCache:'none' makes update checks bypass the HTTP cache, so a new
    // sw.js is seen within minutes of a deploy instead of after cache expiry.
    navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).then(function(reg){
      function check(){ reg.update().catch(function(){}); }
      function activateWaiting(){ if (reg.waiting && navigator.serviceWorker.controller) reg.waiting.postMessage('skipWaiting'); }
      reg.addEventListener('updatefound', function(){ var w = reg.installing; if (w) w.addEventListener('statechange', function(){ if (w.state === 'installed') activateWaiting(); }); });
      activateWaiting();
      check();
      document.addEventListener('visibilitychange', function(){ if (!document.hidden) check(); });
      window.addEventListener('focus', check);
      window.addEventListener('online', check);
      setInterval(function(){ if (!document.hidden) check(); }, 15 * 60 * 1000);
    }).catch(function(){});
  });
}
</script>
